}

function loadProgress() {
    const pageName = window.location.pathname.split("/").pop().replace(".html", ""); // Получаем имя текущей страницы без ".html"
    console.log("Загрузка данных");
    Game.level = parseInt(localStorage.getItem(`level_${pageName}`)) || 1;
    Game.points = parseInt(localStorage.getItem(`points_${pageName}`)) || 0;
    Game.correctAnswers = parseInt(localStorage.getItem(`correctAnswers_${pageName}`)) || 0;
    Game.stars = parseInt(localStorage.getItem(`stars`)) || 0;
    Game.updateUI();
}

const Timer = {
    timeLeft: 30,
    intervalId: null,

    start(level, updateCallback, endCallback) {
        this.timeLeft = Math.max(12, baseTime - (level - 1));  // Устанавливаем минимальное время в 5 секунд
        clearInterval(this.intervalId);
        updateCallback(this.timeLeft); // Сразу обновляем UI
        this.intervalId = setInterval(() => {
            this.timeLeft--;
            updateCallback(this.timeLeft);
            if (this.timeLeft <= 0) {
                clearInterval(this.intervalId);
                endCallback();  // Вызов функции, если время закончилось
            }
        }, 1000);
    },

    reset() {
        clearInterval(this.intervalId);
    }
};

function triggerStarPulse() {
    const starsElement = document.getElementById("stars");
    const starSound = document.getElementById("starSound");

    // Удаляем класс перед его повторным добавлением, чтобы гарантировать перезапуск анимации

    // Задержка, чтобы браузер "увидел" изменение

        starSound.currentTime = 0;  // Сброс звука к началу
        starSound.play();           // Проигрываем звуковой эффект
    }, 20);  // Небольшая задержка для перезапуска анимации
}

// Функция для выбора случайного слова
function getRandomUnusedWordIndex() {
    // Проверка: если все слова использованы, сбрасываем текущие использованные слова
    if (currentLevelWords.length === easywords.length) {
        currentLevelWords = [];  // Сбрасываем список использованных слов, чтобы начать заново
        console.log("Все слова использованы. Начинаем заново.");
    }

    let randomIndex;
    let attempts = 0;
    do {
        randomIndex = Math.floor(Math.random() * easywords.length);  // Генерируем случайный индекс из массива `easywords`
        attempts++;
        if (attempts > easywords.length) {  // Избегаем бесконечного цикла, если все слова уже были использованы
            throw new Error("Нет доступных слов для использования");
        }
    } while (currentLevelWords.includes(randomIndex) || getUsageCount(randomIndex) >= 5);

    currentLevelWords.push(randomIndex);
    updateUsageCount(randomIndex);  // Обновляем количество использования выбранного слова

    return randomIndex;
}
// Функция для получения количества использования слова
function getUsageCount(index) {
    return wordUsageCount[index] || 0;
}

// Функция для обновления количества использования слова
function updateUsageCount(index) {
    wordUsageCount[index] = (wordUsageCount[index] || 0) + 1;
}

// Функция для сброса глобального количества использования слов (например, при сбросе игры)
function resetWordUsageCount() {
    wordUsageCount = {};
}
// Функция для установки случайного слова
function setRandomWord() {
    const randomIndex = getRandomUnusedWordIndex();
    currentWordIndex = randomIndex;  // Обновляем текущий индекс

    const currentWord = easywords[randomIndex];
    const correctOption = Math.random() > 0.5 ? "option1" : "option2";

    const wordElement = document.getElementById("word");
    wordElement.innerText = `${currentWord.korean}`;

    adjustFontSizeToFit(wordElement); // Подгонка размера шрифта под контейнер

    document.getElementById(correctOption).innerText = currentWord.russian;
    document.getElementById(correctOption === "option1" ? "option2" : "option1").innerText = getRandomIncorrectTranslation(randomIndex);
    
    const wordAudio = document.getElementById("wordAudio");
    wordAudio.src = currentWord.audio;
}
function adjustFontSizeToFit(element) {
    let fontSize = 55; // Начальный размер шрифта
    element.style.fontSize = `${fontSize}px`;

    // Уменьшаем размер шрифта, пока текст не помещается в контейнер
    while (element.scrollWidth > element.clientWidth) {
        fontSize--;
        element.style.fontSize = `${fontSize}px`;

        if (fontSize < 10) break; // Ограничиваем минимальный размер текста
    }
}

function hideContinueButton() {
    document.getElementById("continueButton").style.display = "none";  // Скрываем кнопку "Продолжить"
    document.getElementById("option1").style.display = "inline-block"; // Показываем кнопки выбора ответа
    document.getElementById("option2").style.display = "inline-block";
}
function checkWord(selectedButton) {
    // Отключаем обе кнопки, чтобы предотвратить повторные нажатия
    document.getElementById("option1").disabled = true;
    document.getElementById("option2").disabled = true;

    const selectedWord = selectedButton.innerText;
    const correctWord = easywords[currentWordIndex].russian;  // Используем правильный массив

    if (selectedWord === correctWord) {
        Game.correctAnswers++;
        Game.points++;
        updateResult("");
        var successAudio = new Audio('success.mp3');
        successAudio.play();
    } else {
        Game.points = Math.max(Game.points - 1, 0); // Уменьшаем очки на 1, не допуская отрицательных значений
        updateResult("");
        var clickAudio = new Audio('click.mp3');
        clickAudio.play();
        
    }

    Game.updateUI();  // Обновляем интерфейс
    saveProgress();

    if (Game.points >= 10) {
        setTimeout(() => {
            Game.levelUp(); // Переходим на новый уровень
        }, 500);
    } else {
        setTimeout(startGame, 500);  // Переходим к следующему слову
    }
}
function getRandomIncorrectTranslation(correctIndex) {
    let randomIndex;
    do {
        randomIndex = Math.floor(Math.random() * easywords.length);
    } while (randomIndex === correctIndex);
    return easywords[randomIndex].russian;
}
function resetProgress() {

function updateResult(message, className) {
    const resultElement = document.getElementById("result");
    resultElement.innerText = message;
    resultElement.className = className;

    // Устанавливаем специфический размер шрифта для каждого класса

        resultElement.style.fontSize = "30px"; // Для правильного ответа
    } else if (className === "incorrect") {
        resultElement.style.fontSize = "30px"; // Для неправильного ответа
    } else {
        resultElement.style.fontSize = "18px"; // Размер по умолчанию
    }
}

        function startTimerOnPage() {
    const isMember = localStorage.getItem("member") === "true";
    if (isMember) {
        // Если член, таймер не запускаем и отображаем сообщение о доступе
        return; // Выходим из функции, чтобы не запускать таймер
    }
    
    let remainingTime = parseInt(localStorage.getItem("remainingTime"), 10);

    // Проверка, если данные отсутствуют, устанавливаем значение по умолчанию (10 минут)
    if (isNaN(remainingTime)) {
        remainingTime = 10 * 60; // 10 минут в секундах
        localStorage.setItem("remainingTime", remainingTime);
    }

    const display = document.querySelector('.timer');
    display.style.display = "block"; // Делаем таймер видимым при запуске
    let timerInterval;
    let showTime = false; // Флаг для переключения отображения времени

    // Функция для обновления отображения таймера
    function updateDisplay() {
        if (showTime) {
            const minutes = Math.floor(remainingTime / 60);
            const seconds = remainingTime % 60;
            display.style.color = remainingTime <= 60 ? 'red' : 'black';
            display.textContent = `${minutes < 10 ? "0" : ""}${minutes}:${seconds < 10 ? "0" : ""}${seconds}`;
        } else {
            display.textContent = "⏳"; // Значок по умолчанию
        }
    }

    // Функция для запуска таймера
    function startCountdown() {
        timerInterval = setInterval(() => {
            remainingTime--;

            if (remainingTime <= 0) {
                clearInterval(timerInterval);
                remainingTime = 0;
                localStorage.setItem("remainingTime", remainingTime);
                
                // Перенаправление на главную страницу, если время истекло
                window.location.href = "index.html"; // Замените "index.html" на URL вашей главной страницы
            }

            // Обновляем отображение и сохраняем текущее время
            if (showTime) updateDisplay();
            localStorage.setItem("remainingTime", remainingTime);
        }, 1000);
    }

    // Функция для остановки таймера
    function stopCountdown() {
        clearInterval(timerInterval);
    }

    display.addEventListener("click", () => {
        showTime = !showTime; // Переключаем флаг
        updateDisplay(); // Обновляем отображение в зависимости от флага
    });

    // Обработчик изменения видимости страницы
    document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
            // Если страница скрыта, останавливаем таймер
            stopCountdown();
        } else {
            // Если страница видима, запускаем таймер
            startCountdown();
        }
    });

    // Запуск отображения и отсчета
    updateDisplay();

    // Проверяем, видима ли страница при загрузке
    if (!document.hidden) {
        startCountdown();
    }

    // Остановка таймера и сохранение времени при уходе со страницы
    window.addEventListener("beforeunload", () => {
        stopCountdown();
        localStorage.setItem("remainingTime", remainingTime);
    });
}

// Запуск функции, когда DOM полностью загружен
document.addEventListener("DOMContentLoaded", startTimerOnPage);
