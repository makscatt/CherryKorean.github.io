    <script>
 window.addEventListener('DOMContentLoaded', function() {
    const miniMenu = document.getElementById('mini-menu');
    const overlay = document.getElementById('overlay');
    const gameContainer = document.getElementById('gameContainer'); // Элементы игры

    // Убедитесь, что меню и подложка скрыты при загрузке страницы
    miniMenu.style.display = 'none';
    overlay.style.display = 'none';

    // Кнопка для открытия/закрытия меню
    const mainMenuButton = document.getElementById('main-menu-button');

    // Открытие меню
    mainMenuButton.addEventListener('click', function() {
        if (miniMenu.style.display === 'none' || miniMenu.style.display === '') {
            miniMenu.style.display = 'flex'; // Показываем мини-меню
            overlay.style.display = 'block'; // Показываем подложку
            gameContainer.classList.add('blur'); // Применяем размытие к игровым элементам
        } else {
            miniMenu.style.display = 'none'; // Скрываем мини-меню
            overlay.style.display = 'none'; // Скрываем подложку
            gameContainer.classList.remove('blur'); // Убираем размытие
        }
    });

    // Закрытие меню при клике вне меню
    overlay.addEventListener('click', function() {
        miniMenu.style.display = 'none'; // Скрываем мини-меню
        overlay.style.display = 'none'; // Скрываем подложку
        gameContainer.classList.remove('blur'); // Убираем размытие
    });

    // Обработка кнопок внутри мини-меню
    document.getElementById('menu-button').addEventListener('click', function() {
        console.log('Меню нажато');
        // Здесь ваша логика для действия кнопки "Меню"
        // Например, переход на другую страницу
        window.location.href = 'index.html';
    });

    document.getElementById('back-button').addEventListener('click', function() {
        console.log('Назад нажато');
        // Логика для кнопки "Назад"
        // Например, возвращение на предыдущий экран
        window.history.back();
    });

    document.getElementById('resetProgressButton').addEventListener('click', function() {
        console.log('Сброс прогресса');
        
        // Логика для кнопки "Сброс"
        resetProgress(); // Ваш существующий метод для сброса прогресса
    });
});
window.addEventListener('pageshow', function(event) {
    if (event.persisted) {
        window.location.reload();
    }
});

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('theme1').classList.add('active');
            document.getElementById('theme9').classList.add('active');
    // Проверяем состояние каждой темы в localStorage
    for (let i = 1; i <= 12; i++) {
        if (localStorage.getItem('theme' + i) === 'true') {
            // Делаем кнопку активной
            document.getElementById('theme' + i).classList.add('active');
        }
    }
});
function playPushButton(){
    var pushAudio = new Audio('pushButton.mp3');
        pushAudio.play();
}
function loadButtonsWithImages() {
    const themeButtons = document.querySelectorAll('.theme-button');

    themeButtons.forEach(button => {
        const backgroundImage = button.style.backgroundImage;
        if (backgroundImage) {
            const urlMatch = backgroundImage.match(/url\("(.*)"\)/);
            if (urlMatch && urlMatch[1]) {
                const img = new Image();
                img.src = urlMatch[1];
                img.onload = () => {
                    button.classList.add('loaded');
                    button.style.display = 'block';
                };
                img.onerror = () => {
                    button.style.display = 'none';
                    button.style.pointerEvents = 'none';
                };
            } else {
                button.style.display = 'none';
                button.style.pointerEvents = 'none';
            }
        } else {
            button.style.display = 'none';
            button.style.pointerEvents = 'none';
        }
    });
}

// Call the function when the document is fully loaded
document.addEventListener('DOMContentLoaded', loadButtonsWithImages);

function showCardsMenu() {
        window.location.href = 'themes.html'; 
        playPushButton();
    }
         function previousPage() {
        window.location.href = 'themes.html'; // Временная реализация для отображения, что меню открыто
    }
         function nextPage() {

    }
    function showMenu() {
    window.history.back(); // Возвращает на предыдущую страницу
    playPushButton();
}
        function selectTheme(themeId) {
            // Переход на соответствующую страницу темы
            window.location.href = 'audiotheme' + themeId + '.html';
            playPushButton();
        }

        function navigate(direction) {
            if (direction === 'menu') {
                // Переход на главную страницу (index.html)
                window.location.href = 'index.html';
            }
            // Логика для навигации "back" и "forward" может быть добавлена здесь
            console.log("Навигация:", direction);
        }

        // Инициализация Telegram Mini App
        if (window.Telegram.WebApp) {
            Telegram.WebApp.ready();
            Telegram.WebApp.expand(); // Расширяем приложение до полного экрана
        }
