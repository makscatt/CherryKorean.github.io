name: Deploy to Yandex Object Storage

on:
  push:
    branches:
      - main

jobs:
  upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          persist-credentials: true

      # --- Пересчитываем totalCount / hasNew в config.json ---
      - name: Rebuild config.json
        run: python rebuild_config.py

      - name: Commit updated config (if changed)
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add videothemes/json/config.json
          git diff --cached --quiet || git commit -m "auto: update config totalCount/hasNew"
          git push

      - name: Install s3cmd
        run: sudo apt-get install -y s3cmd

      - name: Configure s3cmd
        run: |
          echo "[default]" > ~/.s3cfg
          echo "access_key = ${{ secrets.YANDEX_ACCESS_KEY }}" >> ~/.s3cfg
          echo "secret_key = ${{ secrets.YANDEX_SECRET_KEY }}" >> ~/.s3cfg
          echo "host_base = storage.yandexcloud.net" >> ~/.s3cfg
          echo "host_bucket = storage.yandexcloud.net" >> ~/.s3cfg
          echo "bucket_location = ru-central1" >> ~/.s3cfg
          echo "use_https = True" >> ~/.s3cfg

      - name: Upload all CSS files with correct MIME
        run: |
          find . -type f -name "*.css" | while read file; do
            s3cmd put "$file" "s3://${{ secrets.YANDEX_BUCKET }}/${file#./}" \
              --mime-type="text/css" --acl-public
          done

      - name: Sync all other files
        run: |
          s3cmd sync --delete-removed ./ s3://${{ secrets.YANDEX_BUCKET }} \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "*.md" \
            --exclude "deploy.yml" \
            --exclude "*.css"