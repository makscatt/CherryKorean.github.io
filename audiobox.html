        window.addEventListener('DOMContentLoaded', function() {

        async function loadWords() {
    try {
        const response = await fetch('audiobox.json?nocache=' + new Date().getTime());
        const data = await response.json();

        easywords = data;

        // Проверяем сохраненные данные в localStorage
        const storedWords = JSON.parse(localStorage.getItem('easywords')) || {};

        // Обновляем состояние слов из localStorage (если есть)
        easywords.forEach(word => {
            if (storedWords[word.audio]) {
                word.new = storedWords[word.audio].new;
            }
        });

        startGame();  // Запуск игры после загрузки
    } catch (error) {
        console.error('Ошибка при загрузке JSON:', error);
    }
}

function saveProgress() {

function loadProgress() {
    const pageName = window.location.pathname.split("/").pop().replace(".html", ""); // Получаем имя текущей страницы без ".html"
    console.log("Загрузка данных");
    Game.level = parseInt(localStorage.getItem(`level_${pageName}`)) || 1;
    Game.points = parseInt(localStorage.getItem(`points_${pageName}`)) || 0;
    Game.correctAnswers = parseInt(localStorage.getItem(`correctAnswers_${pageName}`)) || 0;
    Game.stars = parseInt(localStorage.getItem(`stars`))|| 0;
    Game.updateUI();
}

const TimerAudio = {
    timeLeft: 30,
    intervalId: null,

    start(level, updateCallback, endCallback) {
        this.timeLeft = Math.max(12, baseTime - (level - 1));  // Устанавливаем минимальное время в 5 секунд
        clearInterval(this.intervalId);
        updateCallback(this.timeLeft); // Сразу обновляем UI
        this.intervalId = setInterval(() => {
            this.timeLeft--;
            updateCallback(this.timeLeft);
            if (this.timeLeft <= 0) {
                clearInterval(this.intervalId);
                endCallback();  // Вызов функции, если время закончилось
            }
        }, 1000);
    },

    reset() {
        clearInterval(this.intervalId);
    }
};

const Game = {
    points: 0,
    correctAnswers: 0,
    level: 1,
    stars: 0,

    levelUp() {
    this.level++;
    this.correctAnswers = 0;
    this.points = 0;
    this.stars++;  // Начисляем звездочки

    currentLevelWords = [];  // Сбрасываем использованные слова для нового уровня

    document.getElementById("levelComplete").innerText = `Уровень ${this.level - 1}`;
    saveProgress();
    Game.updateUI();  // Обновляем интерфейс после начисления звездочек
    triggerStarPulse();  // Запускаем анимацию пульсации звезды
    
    TimerAudio.reset();  // Останавливаем таймер при завершении уровня
    showContinueButton();  // Показываем кнопку "Продолжить"
},

    updateUI() {
        document.getElementById("points").innerText = `Очки: ${this.points} / 10`;
        document.getElementById("level").innerText = `Уровень: ${this.level}`;
        document.getElementById("stars").innerText = `⭐ ${this.stars}`; // Обновление звездочек с эмодзи
        document.getElementById("timeLeft").innerText = TimerAudio.timeLeft;
    }
    
};

function triggerStarPulse() {
    const starsElement = document.getElementById("stars");
    const starSound = document.getElementById("starSound");

    // Удаляем класс перед его повторным добавлением, чтобы гарантировать перезапуск анимации
    starsElement.classList.remove("pulsing");

    // Задержка, чтобы браузер "увидел" изменение
    setTimeout(() => {
        starsElement.classList.add("pulsing");
        starSound.currentTime = 0;  // Сброс звука к началу
        starSound.play();           // Проигрываем звуковой эффект
    }, 20);  // Небольшая задержка для перезапуска анимации
}
function startGame() {
    hideContinueButton();  // Скрываем кнопку "Продолжить" и показываем кнопки выбора ответа
    document.getElementById("levelComplete").innerText = ""; // Очищаем сообщение о завершении уровня

    resetUI();

    // Включаем кнопки снова для нового раунда
    document.getElementById("option1").disabled = false;
    document.getElementById("option2").disabled = false;

    // Здесь убираем автоматический переход на новый уровень, проверка по очкам будет в checkWord
    if (Game.points >= 10) {
        return;
    }

    setTimeout(() => {
        setRandomWord();  // Устанавливаем слово с небольшой задержкой
        TimerAudio.start(Game.level, (timeLeft) => {
            document.getElementById("timeLeft").innerText = timeLeft;
        }, timeRanOut);
    }, 150);
}
Game.levelUp = function() {
    this.level++;
    this.correctAnswers = 0;
    this.points = 0;
    this.stars++;  // Начисляем звездочки

    currentLevelWords = [];  // Сбрасываем использованные слова для нового уровня

    document.getElementById("levelComplete").innerText = `Уровень ${this.level - 1} пройден!`;
    launchConfetti();
    updateResult("");
    saveProgress();
    Game.updateUI();  // Обновляем интерфейс после начисления звездочек
    triggerStarPulse();  // Запускаем анимацию пульсации звезды

    TimerAudio.reset();  // Останавливаем таймер при завершении уровня
    showContinueButton();  // Показываем кнопку "Продолжить"
}
function launchConfetti() {

    confetti({
        particleCount: 1000, // Количество частиц
        spread: 70,         // Угол распространения конфетти

function timeRanOut() {
    // Сброс очков текущего уровня
    Game.points = 0;
    Game.correctAnswers = 0;

    // Вывод сообщения об окончании времени
    const resultElement = document.getElementById("result");
    resultElement.innerText = "Время вышло!\n Начни заново.";
    resultElement.className = "time-out"; // Присваиваем красный цвет через класс

    // Показываем кнопку "Начать заново"
    document.getElementById("restartButton").style.display = "block";

    // Обновляем интерфейс
    Game.updateUI();
}

// Функция для выбора случайного слова
function getRandomUnusedWordIndex() {
    // Если все слова уже использованы на текущем уровне, сбрасываем массив
    if (currentLevelWords.length === easywords.length) {
        currentLevelWords = [];  // Сбрасываем слова уровня после его завершения
        console.log("Все слова использованы, сбрасываем список.");
    }

    let randomIndex;
    let attempts = 0;
    do {
        randomIndex = Math.floor(Math.random() * easywords.length);
        attempts++;
        if (attempts > easywords.length) {
            throw new Error("Нет доступных слов для использования");
        }
    } while (currentLevelWords.includes(randomIndex) || getUsageCount(randomIndex) >= 5);

    currentLevelWords.push(randomIndex);
    updateUsageCount(randomIndex);  // Обновляем количество использования выбранного слова

    return randomIndex;
}
// Функция для получения количества использования слова
function getUsageCount(word) {
    return wordUsageCount[word.audio] || 0;
}

// Функция для обновления количества использования слова
function updateUsageCount(word) {
    // Если слово было новым, изменяем его статус на false
    if (word.new) {
        word.new = false;
        console.log(`Слово ${word.russian} больше не новое.`);

        // Сохраняем обновленные данные в localStorage
        const storedWords = JSON.parse(localStorage.getItem('easywords')) || {};
        storedWords[word.audio] = { new: false };
        localStorage.setItem('easywords', JSON.stringify(storedWords));
    }

    // Обновляем счетчик использования
    wordUsageCount[word.audio] = (wordUsageCount[word.audio] || 0) + 1;
    saveWordUsageCount();  // Сохраняем обновленный счетчик в localStorage
}
function saveWordUsageCount() {
    localStorage.setItem('wordUsageCount', JSON.stringify(wordUsageCount));
}
function loadWordUsageCount() {
    const storedUsageCount = localStorage.getItem('wordUsageCount');
    if (storedUsageCount) {
        wordUsageCount = JSON.parse(storedUsageCount);
    } else {
        wordUsageCount = {};
    }

    // Инициализируем счетчики для всех слов
  
}
// Функция для сброса глобального количества использования слов (например, при сбросе игры)
function resetWordUsageIfNeeded() {
    // Проверяем, если все слова использованы 5 раз
    const allWordsUsedFiveTimes = easywords.every(word => (wordUsageCount[word.audio] || 0) >= 5);
    if (allWordsUsedFiveTimes) {
        wordUsageCount = {};  // Сбрасываем счетчик
        saveWordUsageCount();  // Сохраняем пустой счетчик
        console.log("Все слова использованы 5 раз. Счетчик сброшен.");
    }
}
// Функция для установки случайного слова
function setRandomWord() {
    resetWordUsageIfNeeded();  // Проверяем, если все слова использованы 5 раз, сбрасываем счетчик

    let selectedWord;

    // 1. Фильтруем все слова, где "new": true
    const newWords = easywords.filter(word => word.new === true);

    // Отладка: выводим количество новых слов
    console.log(`Найдено новых слов: ${newWords.length}`);

    // 2. Если есть новые слова, выбираем случайное из новых слов
    if (newWords.length > 0) {
        selectedWord = newWords[Math.floor(Math.random() * newWords.length)];
        console.log('Выбрано новое слово:', selectedWord);
    } else {
        // 3. Если все новые слова уже использованы, выбираем слово с использованием менее 5 раз
        const remainingWords = easywords.filter(word => getUsageCount(word) < 5);
        if (remainingWords.length > 0) {
            selectedWord = remainingWords[Math.floor(Math.random() * remainingWords.length)];
            console.log('Выбрано слово с использованием менее 5 раз:', selectedWord);
        } else {
            // Если все слова использованы 5 раз, сбрасываем счетчик и выбираем случайное слово
            resetWordUsageIfNeeded();
            selectedWord = easywords[Math.floor(Math.random() * easywords.length)];
            console.log('Все слова использованы, выбрано случайное слово:', selectedWord);
        }
    }

    // Находим индекс выбранного слова
    currentWordIndex = easywords.indexOf(selectedWord);

    // 4. Устанавливаем варианты ответов на кнопках
    const correctOption = Math.random() > 0.5 ? "option1" : "option2";
    document.getElementById(correctOption).innerText = selectedWord.russian;
    document.getElementById(correctOption === "option1" ? "option2" : "option1").innerText = getRandomIncorrectTranslation(currentWordIndex);

    // 5. Устанавливаем источник аудиофайла для текущего слова
    const wordAudio = document.getElementById("wordAudio");
    wordAudio.src = selectedWord.audio;

    // 6. Автоматически воспроизводим звук при появлении нового слова
    playWordSound();
}



function showContinueButton() {
    document.getElementById("option1").style.display = "none";
    document.getElementById("option2").style.display = "none";
    document.getElementById("continueButton").style.display = "inline-block";  // Показываем кнопку "Продолжить"
}

function hideContinueButton() {
    document.getElementById("continueButton").style.display = "none";  // Скрываем кнопку "Продолжить"
    document.getElementById("option1").style.display = "inline-block"; // Показываем кнопки выбора ответа
    document.getElementById("option2").style.display = "inline-block";
}
function checkWord(selectedButton) {
    // Отключаем обе кнопки, чтобы предотвратить повторные нажатия
    document.getElementById("option1").disabled = true;
    document.getElementById("option2").disabled = true;

    const selectedWord = selectedButton.innerText;
    const correctWord = easywords[currentWordIndex].russian;

    // Проверяем правильность ответа
    if (selectedWord === correctWord) {
        Game.correctAnswers++;

        // Увеличиваем очки только если правильный ответ и очков меньше 10
        if (Game.points < 10) {
            Game.points++;
        }
        updateResult("");
        var successAudio = new Audio('success.mp3');
        successAudio.play();

        // Обновляем статус new на false только при правильном ответе
        if (easywords[currentWordIndex].new) {
            easywords[currentWordIndex].new = false;

            // Обновляем в localStorage только это слово
            const storedWords = JSON.parse(localStorage.getItem('easywords')) || {};
            storedWords[easywords[currentWordIndex].audio] = { new: false };
            localStorage.setItem('easywords', JSON.stringify(storedWords));

            console.log(`Слово ${easywords[currentWordIndex].russian} больше не новое.`);
        }
    } else {
        // При ошибке уменьшаем очки, но не даем упасть ниже 0
        Game.points = Math.max(Game.points - 1, 0);
        updateResult("");
        var clickAudio = new Audio('click.mp3');
        clickAudio.play();
    }

    Game.updateUI();  // Обновляем интерфейс
    saveProgress();

    // Переход на следующий уровень только при точных 10 очках
    if (Game.points === 10) {
        setTimeout(() => {
            Game.levelUp(); // Переход на новый уровень
        }, 500);
    } else {
        // Продолжаем игру, если очков не 10
        setTimeout(startGame, 500);
    }
}

function getRandomIncorrectTranslation(correctWord) {
    let randomWord;
    do {
        randomWord = easywords[Math.floor(Math.random() * easywords.length)];
    } while (randomWord === correctWord);
    return randomWord.russian;
}
function resetProgress() {
    localStorage.clear();
    Game.points = 0;
    Game.level = 1;
    Game.correctAnswers = 0;
    Game.stars = 0;  // Обнуление звездочек
    Game.updateUI();  // Обновление интерфейса
    location.reload();
    startGame();
}

function resetUI() {
    document.getElementById("result").innerText = "";
    document.getElementById("restartButton").style.display = "none";  // Скрываем кнопку "Начать заново"
    document.getElementById("option1").disabled = false;
    document.getElementById("option2").disabled = false;
    TimerAudio.timeLeft = baseTime - (Game.level - 1);  // Сброс таймера
}

function updateResult(message, className) {
    const resultElement = document.getElementById("result");
    resultElement.innerText = message;
    resultElement.className = className;

    // Устанавливаем специфический размер шрифта для каждого класса
    if (className === "correct") {
        resultElement.style.fontSize = "30px"; // Для правильного ответа
    } else if (className === "incorrect") {
        resultElement.style.fontSize = "30px"; // Для неправильного ответа
    } else {
        resultElement.style.fontSize = "18px"; // Размер по умолчанию
    }
}

        function startTimerOnPage() {
    const isMember = localStorage.getItem("member") === "true";
    if (isMember) {
        // Если член, таймер не запускаем и отображаем сообщение о доступе
        return; // Выходим из функции, чтобы не запускать таймер
    }
    
    let remainingTime = parseInt(localStorage.getItem("remainingTime"), 10);

    // Проверка, если данные отсутствуют, устанавливаем значение по умолчанию (10 минут)
    if (isNaN(remainingTime)) {
        remainingTime = 10 * 60; // 10 минут в секундах
        localStorage.setItem("remainingTime", remainingTime);
    }

    const display = document.querySelector('.timer');
    display.style.display = "block"; // Делаем таймер видимым при запуске
    let timerInterval;
    let showTime = false; // Флаг для переключения отображения времени

    // Функция для обновления отображения таймера
    function updateDisplay() {
        if (showTime) {
            const minutes = Math.floor(remainingTime / 60);
            const seconds = remainingTime % 60;
            display.style.color = remainingTime <= 60 ? 'red' : 'black';
            display.textContent = `${minutes < 10 ? "0" : ""}${minutes}:${seconds < 10 ? "0" : ""}${seconds}`;
        } else {
            display.textContent = "⏳"; // Значок по умолчанию
        }
    }

    // Функция для запуска таймера
    function startCountdown() {
        timerInterval = setInterval(() => {
            remainingTime--;

            if (remainingTime <= 0) {
                clearInterval(timerInterval);
                remainingTime = 0;
                localStorage.setItem("remainingTime", remainingTime);
                
                // Перенаправление на главную страницу, если время истекло
                window.location.href = "index.html"; // Замените "index.html" на URL вашей главной страницы
            }

            // Обновляем отображение и сохраняем текущее время
            if (showTime) updateDisplay();
            localStorage.setItem("remainingTime", remainingTime);
        }, 1000);
    }

    // Функция для остановки таймера
    function stopCountdown() {
        clearInterval(timerInterval);
    }

    display.addEventListener("click", () => {
        showTime = !showTime; // Переключаем флаг
        updateDisplay(); // Обновляем отображение в зависимости от флага
    });

    // Обработчик изменения видимости страницы
    document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
            // Если страница скрыта, останавливаем таймер
            stopCountdown();
        } else {
            // Если страница видима, запускаем таймер
            startCountdown();
        }
    });

    // Запуск отображения и отсчета
    updateDisplay();

    // Проверяем, видима ли страница при загрузке
    if (!document.hidden) {
        startCountdown();
    }

    // Остановка таймера и сохранение времени при уходе со страницы
    window.addEventListener("beforeunload", () => {
        stopCountdown();
        localStorage.setItem("remainingTime", remainingTime);
    });
}

// Запуск функции, когда DOM полностью загружен
document.addEventListener("DOMContentLoaded", startTimerOnPage);

// Инициализация игры
loadWords();
loadProgress();
startGame();

</script>
</body>
</html>
