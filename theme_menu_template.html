<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <title>Кнопки</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="font.css" />

  <link rel="stylesheet" href="minimenu.css">
  <link rel="stylesheet" href="videosubmenustyles.css">
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100vw;
      height: 100vh;
      background-color: #000000;
      font-family: 'NetflixSans-Regular', Arial, sans-serif;
    }

    #bg-image {
      width: 100%;
      height: auto;
      display: block;

    }

    #gameContainer {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
      margin: auto;
      width: 100vw;
      /* Используем относительную единицу измерения */
      height: 100vh;
      padding-top: 0px;
      background: linear-gradient(to bottom, #000000 20%, #ffffff 20%);

    }


    @media (hover: hover) and (pointer: fine) {
      #gameContainer {
        max-width: 600px;
        margin: 0 auto;
      }

    }

    #menu-button-container {
      position: relative;
      max-width: 100%;
      gap: 5px;
      margin-top: auto;
      height: 10%;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      border-radius: 10px 10px 0 0;

      /* --- ГЛЯНЦЕВЫЙ ЭФФЕКТ ДЛЯ ТЕМНОЙ ПАНЕЛИ --- */

      /* 1. Темный градиент для имитации объема */
      background: linear-gradient(to bottom, #2f2f31, #1C1C1E);

      /* 2. Только верхняя граница для отделения от контента */
      border: none;
      /* Сначала сбрасываем старую рамку */
      border-top: 1px solid rgba(255, 215, 0, 0.4);

      /* 3. Тень: внутренний блик + тень ВВЕРХ для отделения от контента */
      box-shadow:
        inset 0 1px 1px rgba(255, 255, 255, 0.1),
        /* Внутренний блик сверху */
        0 -1px 5px rgba(0, 0, 0, 0.5);
      /* Внешняя тень, отбрасываемая вверх на контент */
    }

    #stars {
      display: flex;
      font-size: 20px;
      color: white;
    }

    #starsInstruction {
      width: 100%;
      height: 100%;
      font-size: 15px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    button {
      margin: 5px;
      padding: 5px 10px;
      font-size: 18px;
      cursor: pointer;
      background-color: #ffffff;
      color: rgb(51, 51, 51);
      border-radius: 5px;
      transition: all 0.1s ease-in-out;
      border: none;
      outline: 1px solid rgba(0, 0, 0, 0.1);
      outline-offset: -1px;
      box-shadow: 0 4px 0 #bbb;
    }

    button:active {
      box-shadow: 0 1px 8px #b7b7b7;
      transform: translateY(4px);
    }


    #main-menu-button {
      font-size: 28px;
      margin-left: auto;
      margin-right: 15px;
    }

    #back-button {
      font-size: 28px;
      margin-right: auto;
    }

    #buttons-container {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      height: auto;
      overflow-y: auto;
      padding: 10px;

      width: 100%;
      box-sizing: border-box;
    }

    #buttons-container::-webkit-scrollbar {
      display: none;
    }

    #buttons-container .submenubutton {
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      width: 100%;

      /* --- ГЛЯНЦЕВЫЙ ЭФФЕКТ НАЧИНАЕТСЯ ЗДЕСЬ --- */

      /* 1. Основной фон - градиент от светлого к темному */
      background: linear-gradient(to bottom, #ffffff 0%, #f1f1f1 100%);

      /* 2. Рамка с эффектом объема */
      border: 1px solid #b8b8b8;
      border-top-color: #d1d1d1;
      border-bottom-color: #a3a3a3;

      /* 3. Тень: внешняя для объема и внутренняя для блика */
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.6),
        /* Внутренний блик сверху */
        0 2px 3px rgba(0, 0, 0, 0.1);
      /* Внешняя тень снизу */

      /* 4. Тень для текста, чтобы он лучше читался */
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.8);

      /* --- КОНЕЦ ГЛЯНЦЕВОГО ЭФФЕКТА --- */

      color: #333333;
      /* Сделаем текст чуть темнее для контраста */
      padding: 12px 16px;
      margin-bottom: 8px;
      font-size: clamp(18px, 4vw, 36px);
      text-align: left;
      font-weight: 500;
      /* Немного жирнее */
      border-radius: 8px;
      box-sizing: border-box;
      cursor: pointer;
      transition: all 0.2s ease;
      /* Плавный переход для всех свойств */
      height: clamp(70px, 5vw, 90px);
    }

    #buttons-container .submenubutton:hover {
      background-color: #eeeeee;
    }

    .submenubutton.locked {
      position: relative;
    }

    .submenubutton.pathway-locked::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 60%;
      width: clamp(40%, 5vw, 100%);
      height: 100px;
      background: url('lockhorizont.png') no-repeat center center;
      background-size: contain;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .submenubutton.locked::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 60%;
      width: clamp(40%, 5vw, 100%);
      /* Можно настроить размер замка */
      height: 100%;
      /* Можно настроить размер замка */
      background: url('redlockhorizont.png') no-repeat center center;
      background-size: contain;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .theme-count-container {
      margin-left: 0;
      display: flex;
      align-items: center;
      border-radius: 8px;
      position: relative;
      gap: 1px;

    }

    .theme-tape-icon {
      width: clamp(50px, 5vw, 100px);
      height: clamp(50px, 5vw, 100px);
      object-fit: contain;
      margin-right: -6px;
      display: block;

    }

    .theme-count {
      font-size: clamp(20px, 5vw, 40px);
      font-weight: bold;
      color: #000000;

      min-width: 18px;
      text-align: center;
      letter-spacing: 0.5px;
    }

    .lock-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 28px;
      color: black;
      background-color: rgba(255, 255, 255, 0.6);
      pointer-events: none;
    }

    .theme-badge {
      position: absolute;
      top: -7px;
      right: 10px;
      background-color: red;
      color: white;
      font-size: 14px;
      padding: 2px 6px;
      border-radius: 4px;
      z-index: 2;
    }
  </style>
</head>

<body>
  <div id="fadeOverlay" style="
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: black;
    opacity: 1;
    z-index: 100000;
    transition: opacity 0.4s ease;">
  </div>


  <div id="gameContainer">

    <img id="bg-image" src="videothemes/subthemebc/demo.png" alt="фон" />
    <div id="buttons-container"></div>

    <div id="menu-button-container">
      <div id="stars">⭐ 0</div>
      <!--<div id="starsInstruction">За правильные ответы получай ⭐<br>Октрыть блок BTS - 10⭐</div>-->
      <button id="main-menu-button" class="nav-button" onclick="goHome()">
        <img src="videothemes/icons/home.png" alt="Home" style="width: 45px; height: 45px;">
      </button>
    </div>
  </div>

  <script>

    // --- КОНФИГУРАЦИЯ ---
    const CONFIG_PATH = 'videothemes/json/config.json'; // Убедитесь, что путь верный
    const starsKey = "stars";

    // --- Начало блока функций ---

    // Глобальные переменные для доступа к элементам
    let premiumPopupOverlay, subscriptionModal, loader, offerPopupOverlay;

    // Показ/скрытие основного попапа (с плавной анимацией)
    function showPremiumPopup() {
      if (premiumPopupOverlay) {
        premiumPopupOverlay.style.opacity = '1';
        premiumPopupOverlay.style.pointerEvents = 'auto';
      }
    }
    function hidePremiumPopup() {
      if (premiumPopupOverlay) {
        premiumPopupOverlay.style.opacity = '0';
        premiumPopupOverlay.style.pointerEvents = 'none';
      }
    }

    // Показ/скрытие модального окна об отписке
    function openModal() {
      if (subscriptionModal) subscriptionModal.style.display = 'block';
    }
    function closeModal() {
      if (subscriptionModal) subscriptionModal.style.display = 'none';
    }

    // НОВЫЕ ФУНКЦИИ ДЛЯ ПОПАПА ОФЕРТЫ
    function showOfferPopup() {
      if (offerPopupOverlay) {
        const iframe = offerPopupOverlay.querySelector('iframe');
        const offerUrl = "videooffer.html"; // URL без параметров

        if (iframe && iframe.getAttribute('src') !== offerUrl) {
          iframe.setAttribute('src', offerUrl);
        }
        offerPopupOverlay.style.display = 'flex';
      }
    }
    function hideOfferPopup() {
      if (offerPopupOverlay) offerPopupOverlay.style.display = 'none';
    }

    // Перенаправление на оплату
    async function redirectToPayment() {
      if (loader) loader.style.display = "flex";

      const telegramId = window.Telegram?.WebApp?.initDataUnsafe?.user?.id || localStorage.getItem("telegramId");
      if (!telegramId) {
        if (loader) loader.style.display = "none";
        return;
      };

      try {
        const res = await fetch(`https://telegram-server-hfk7.onrender.com/getPaymentLink?telegramId=${telegramId}`);
        const data = await res.json();
        if (data.url) {
          window.location.href = data.url;
        } else {
          if (loader) loader.style.display = "none";
          console.error("Ошибка получения ссылки на оплату.");
        }
      } catch (err) {
        console.error("Ошибка при получении ссылки:", err);
        if (loader) loader.style.display = "none";
      }
    }

    // --- Конец блока функций ---

    // --- УТИЛИТЫ ---
    function getStars() {
      return parseInt(localStorage.getItem(starsKey)) || 0;
    }

    function setStars(value) {
      localStorage.setItem(starsKey, value);
      const starsEl = document.getElementById('stars');
      if (starsEl) starsEl.textContent = `⭐ ${value}`;
    }

    // --- ОСНОВНАЯ ЛОГИКА ---

    // 1. Переход на страницу с видео (для УРОКОВ и старых тем)
    function goToContentPage(blockKey, masterJsonPath) {
      localStorage.setItem('selectedBlockKey', blockKey);
      localStorage.setItem('masterJsonPath', masterJsonPath);
      // Всегда ведет на один и тот же шаблон видео
      window.location.href = 'video_list_template.html';
    }

    // 2. Рендер кнопок для обычной ТЕМЫ (дорамы)

    // 3. Рендер кнопок для ГЛАВЫ "Тропинки"
    async function renderPathwayMenu(chapterConfig) {
      const container = document.getElementById("buttons-container");
      container.innerHTML = "";

      // Загружаем JSON этой главы, чтобы узнать, какие в ней есть уроки
      const response = await fetch(`${chapterConfig.masterJsonPath}?v=${new Date().getTime()}`);
      const lessonsData = await response.json();
      const lessonKeys = Object.keys(lessonsData);

      // Получаем прогресс по урокам этой главы
      const chapterId = localStorage.getItem('selectedThemeId'); // e.g., 'chapter_1'
      const completedLessons = JSON.parse(localStorage.getItem(`completedLessons_v2_${chapterId}`)) || [];

      lessonKeys.forEach((lessonKey, index) => {
        const lessonName = `Урок ${lessonKey.split('_')[1]}.${lessonKey.split('_')[2]}`;

        const btn = document.createElement("button");
        btn.className = "submenubutton";
        btn.dataset.blockKey = lessonKey;

        const textSpan = document.createElement("span");
        textSpan.textContent = lessonName;

        const countContainer = document.createElement("div");
        countContainer.className = "theme-count-container";
        const lessonPhrasesCount = lessonsData[lessonKey].length;
        countContainer.innerHTML = `<img src="videothemes/icons/tape.png" class="theme-tape-icon" alt="Tape"> x <span class="theme-count">${lessonPhrasesCount}</span>`;

        btn.appendChild(textSpan);
        btn.appendChild(countContainer);

        // Логика блокировки уроков
        const isLocked = index > 0 && !completedLessons.includes(lessonKeys[index - 1]);
        if (isLocked) {
          btn.classList.add('pathway-locked');
        } else {
          btn.addEventListener("click", () => {
            localStorage.setItem('selectedBlockKey', lessonKey);
            localStorage.setItem('masterJsonPath', chapterConfig.masterJsonPath);
            window.location.href = 'pathway_player.html'; // <--- ВОТ ПРАВИЛЬНОЕ ИЗМЕНЕНИЕ
          });
        }

        container.appendChild(btn);
      });
    }

    async function renderSortedThemeMenu(themeConfig) {
      const container = document.getElementById("buttons-container");
      container.innerHTML = ""; // Очищаем

      // Проверяем статус пользователя
      const isMember = localStorage.getItem("member") === "true";

      // 1. Загружаем JSON с фразами, чтобы узнать, какие блоки новые
      const response = await fetch(`${themeConfig.masterJsonPath}?v=${new Date().getTime()}`);
      const masterJsonData = await response.json();

      // 2. "Обогащаем" информацию о блоках: добавляем флаг isNew и кол-во видео
      const enrichedBlocks = themeConfig.blocks.map(block => {
        const blockData = masterJsonData[block.key] || [];
        return {
          key: block.key,
          name: block.name,
          isNew: blockData.some(item => item.isNew === true), // Проверяем новизну
          videoCount: blockData.length
        };
      });

      // 3. Сортируем по вашим правилам
      enrichedBlocks.sort((a, b) => {
        // Абсолютный приоритет для b0
        if (a.key === 'b0') return -1; // b0 всегда идет первым
        if (b.key === 'b0') return 1;  // любой другой блок идет после b0

        // Старая логика сортировки для всех остальных блоков
        if (a.isNew !== b.isNew) {
          return a.isNew ? -1 : 1; // Новинки выше
        }
        const numA = parseInt(a.key.replace('b', ''));
        const numB = parseInt(b.key.replace('b', ''));

        if (a.isNew) {
          return numB - numA; // Новинки по убыванию
        }

        return numA - numB; // Старые по возрастанию
      });

      // 4. Рендерим кнопки в уже правильном порядке
      enrichedBlocks.forEach(block => {
        if (isMember && block.key === 'b0') {
          return; // Пропускаем создание демо-кнопки для 'member'
        }
        const btn = document.createElement("button");
        btn.className = "submenubutton";
        btn.dataset.blockKey = block.key;

        if (block.isNew) {
          const badge = document.createElement("span");
          badge.className = "theme-badge";
          badge.textContent = "Новинка";
          btn.appendChild(badge);
        }

        const textSpan = document.createElement("span");
        textSpan.textContent = block.name;

        const countContainer = document.createElement("div");
        countContainer.className = "theme-count-container";
        countContainer.innerHTML = `<img src="videothemes/icons/tape.png" class="theme-tape-icon" alt="Tape"> x <span class="theme-count">${block.videoCount}</span>`;

        btn.appendChild(textSpan);
        btn.appendChild(countContainer);

        // --- НОВАЯ ЛОГИКА БЛОКИРОВКИ ---
        const isDemoBlock = block.key === 'b0';
        if (!isMember && !isDemoBlock) {
          btn.classList.add('locked');
          // Добавляем обработчик для вызова попапа
          btn.addEventListener('click', () => {
            showPremiumPopup();
          });
        } else {
          btn.addEventListener("click", () => goToContentPage(block.key, themeConfig.masterJsonPath));
        }

        container.appendChild(btn);
      });
    }
    async function initializePage() {
      const themeId = localStorage.getItem('selectedThemeId');
      if (!themeId) {
        document.body.innerHTML = '<h1>Ошибка: Тема не выбрана.</h1>';
        return;
      }

      try {
        const response = await fetch(`${CONFIG_PATH}?v=${new Date().getTime()}`);
        const configData = await response.json();

        // Определяем, это "Тропинка" или обычная тема
        const isPathway = themeId.startsWith('chapter_');
        const configSection = isPathway ? configData.pathway : configData;
        const themeConfig = configSection[themeId];

        if (!themeConfig) {
          document.body.innerHTML = `<h1>Ошибка: Конфигурация для "${themeId}" не найдена.</h1>`;
          return;
        }

        // Устанавливаем фон
        const bgImage = document.getElementById('bg-image');
        if (bgImage) bgImage.src = themeConfig.coverImage;

        // Вызываем нужный рендер
        if (isPathway) {
          await renderPathwayMenu(themeConfig);
          // Для "Тропинки" счетчики уже встроены в рендер, доп. вызов не нужен
        } else {
          await renderSortedThemeMenu(themeConfig);
        }

      } catch (error) {
        console.error("Ошибка при инициализации страницы меню:", error);
        document.body.innerHTML = '<h1>Ошибка загрузки страницы.</h1>';
      } finally {
        const overlay = document.getElementById("fadeOverlay");
        if (overlay) {
          overlay.style.opacity = "0";
          setTimeout(() => overlay.style.display = 'none', 400);
        }
      }
    }

    // --- ЗАПУСК ---
    document.getElementById('main-menu-button').addEventListener('click', () => {
      window.location.href = 'videothemes.html';
    });

    window.addEventListener("pageshow", () => {
      setStars(getStars());

      // --- Динамическое создание всех элементов ---

      // 1. ОСНОВНОЙ ПОПАП
      const overlay = document.createElement('div');
      const content = document.createElement('div');
      const closeBtn = document.createElement('span');
      const kimchiImage = document.createElement('img');
      const mainText = document.createElement('p');
      const priceDiv = document.createElement('div');
      const priceText1 = document.createElement('span');
      const priceText2 = document.createElement('span');
      const howToCancelBtn = document.createElement('button');
      const premiumBtn = document.createElement('button');
      const offerBtn = document.createElement('button');

      const subModal = document.createElement('div');
      const subModalContent = document.createElement('div');
      const subModalCloseBtn = document.createElement('button');
      const subModalText = document.createElement('p');
      const loaderDiv = document.createElement('div');
      const spinner = document.createElement('div');
      const offerOverlay = document.createElement('div');
      const offerContainer = document.createElement('div');
      const offerIframe = document.createElement('iframe');
      const offerCloseBtn = document.createElement('button');

      // --- Наполнение и стилизация ---

      // Основной попап
      kimchiImage.src = 'videothemes/icons/goldkimchi.png';
      mainText.textContent = 'Подключи «Золотое Кимчи»,\nчтобы открыть все темы';
      priceText1.innerHTML = 'Первый месяц <span style="color: #FFD700; font-size: 26px;">99 руб</span>';
      priceText2.innerHTML = '<span style="color: gray;">Затем 300 руб/мес</span>';
      priceText2.style.display = 'block';
      howToCancelBtn.textContent = 'Как отключить подписку?';
      premiumBtn.textContent = 'Подключить за 99 руб';
      offerBtn.textContent = 'Оферта';
      closeBtn.innerHTML = '×';

      // Стилизация
      Object.assign(overlay.style, { position: 'fixed', top: '0', left: '0', width: '100%', height: '100%', backgroundColor: 'rgba(0, 0, 0, 0.6)', display: 'flex', justifyContent: 'center', alignItems: 'center', zIndex: '20000', opacity: '0', pointerEvents: 'none', transition: 'opacity 0.3s ease-in-out' });
      Object.assign(offerContainer.style, { position: 'relative', width: '90%', maxWidth: '700px', height: '85%' });
      Object.assign(content.style, { backgroundColor: '#1C1C1E', padding: '20px', borderRadius: '16px', textAlign: 'center', width: '90%', maxWidth: '380px', boxShadow: '0 5px 15px rgba(0,0,0,0.3)', position: 'relative', color: '#FFFFFF', border: '1px solid rgba(255, 215, 0, 0.9)' });
      Object.assign(closeBtn.style, { position: 'absolute', top: '10px', right: '10px', width: '28px', height: '28px', background: '#3A3A3C', color: '#E5E5EA', borderRadius: '50%', border: 'none', fontSize: '18px', cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center' });
      Object.assign(kimchiImage.style, { width: '60px', height: 'auto', margin: '10px 0' });
      Object.assign(mainText.style, { fontSize: '18px', color: '#FFFFFF', margin: '10px 0 15px 0', padding: '0 10px', fontWeight: '500', whiteSpace: 'pre-line' });
      Object.assign(priceDiv.style, { margin: '15px 0', lineHeight: '1.4' });
      Object.assign(howToCancelBtn.style, { background: 'none', border: 'none', color: '#8E8E93', textDecoration: 'underline', cursor: 'pointer', marginTop: '10px', boxShadow: 'none' });
      Object.assign(premiumBtn.style, { width: '100%', padding: '13px', backgroundColor: '#FFD700', color: '#000000', border: 'none', borderRadius: '8px', fontSize: '18px', cursor: 'pointer', transition: 'transform 0.2s', fontWeight: '700' });
      Object.assign(offerBtn.style, { marginTop: '15px', color: '#666', textDecoration: 'underline', background: 'none', border: 'none', cursor: 'pointer', boxShadow: 'none' });

      subModalText.innerHTML = 'Отключить подписку можно будет в боте – "Кимчи Хангуго" по команде /sub.<br />ㅡㅡㅡ<br />"Кимчи Хангуго" это бот с которого вы запускаете приложение.<br />ㅡㅡㅡ<br />После оплаты, в боте, вам также придет приглашение в закрытый чат - "Кимчи Клаб".';
      Object.assign(subModal.style, { display: 'none', position: 'fixed', top: '0', left: '0', width: '100%', height: '100%', background: 'rgba(0,0,0,0.5)', zIndex: '99999', backdropFilter: 'blur(5px)' });

      Object.assign(loaderDiv.style, { display: 'none', position: 'fixed', top: '0', left: '0', width: '100vw', height: '100vh', backgroundColor: 'rgba(0, 0, 0, 0.6)', zIndex: '99999', alignItems: 'center', justifyContent: 'center' });

        const styleSheet = document.createElement("style");

        styleSheet.innerHTML = `@keyframes spin { to { transform: rotate(360deg); } }`;
        document.head.appendChild(styleSheet);
      }
      Object.assign(offerOverlay.style, { display: 'none', position: 'fixed', top: '0', left: '0', width: '100%', height: '100%', backgroundColor: 'rgba(0, 0, 0, 0.7)', zIndex: '30000', justifyContent: 'center', alignItems: 'center' });
      Object.assign(offerIframe.style, { width: '100%', maxWidth: '700px', height: '100%', border: 'none', borderRadius: '12px', backgroundColor: 'white' });
      Object.assign(offerCloseBtn.style, { position: 'absolute', top: '8%', right: '0%', width: '40px', height: '40px', borderRadius: '50%', border: 'none', background: 'white', color: 'black', fontSize: '20px', cursor: 'pointer', zIndex: '30001', display: 'flex', alignItems: 'center', justifyContent: 'center', boxShadow: '0 1px 4px rgba(0,0,0,0.9)' });

      document.body.appendChild(overlay);

      document.body.appendChild(loaderDiv);
      document.body.appendChild(offerOverlay);

      premiumPopupOverlay = overlay;
      subscriptionModal = subModal;
      loader = loaderDiv;

      // Назначаем события
      closeBtn.addEventListener('click', hidePremiumPopup);

      howToCancelBtn.addEventListener('click', openModal);
      offerBtn.addEventListener('click', showOfferPopup);
      subModalCloseBtn.addEventListener('click', closeModal);

      overlay.addEventListener('click', (e) => { if (e.target === overlay) hidePremiumPopup(); });
      subModal.addEventListener('click', (e) => { if (e.target === subModal) closeModal(); });


      initializePage();
    });
