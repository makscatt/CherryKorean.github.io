<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Отзывы</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- <link rel="stylesheet" href="videoplayer.css"> -->

    <!-- ВАШИ СТИЛИ. СКОПИРОВАНЫ 1 В 1. БЕЗ ИЗМЕНЕНИЙ. -->
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
        }

        body {

            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            background-color: #000000;
            font-family: 'NetflixSans-Regular', Arial, sans-serif;

        }



        #gameContainer {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
            margin: auto;
            width: 100vw;
            /* Используем относительную единицу измерения */
            height: 100vh;
            padding-top: 0px;
            background-image: url('videothemes/reviewsbackground.png');
            background-size: cover;
            /* Растягивает изображение, чтобы покрыть всю область */
            background-position: center;
            /* Центрирует изображение */
            background-repeat: no-repeat;

        }




        @media (hover: hover) and (pointer: fine) {

            #gameContainer {
                max-width: 600px;
                margin: 0 auto;
            }


        }









        button {
            margin: 5px;
            padding: 10px 10px;
            font-size: clamp(20px, 3vw, 30px);
            cursor: pointer;
            background-color: #ffffff;
            color: rgb(51, 51, 51);
            border-radius: 5px;
            transition: all 0.1s ease-in-out;
            border: none;
            box-shadow: 0 4px 0 #bbb;
        }

        button:active {
            box-shadow: 0 1px 4px #b7b7b7;
            transform: translateY(4px);
        }

        #menu-button-container {
            position: relative;
            max-width: 100%;
            gap: 10px;
            margin-top: auto;

            height: 20%;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            background-color: #1C1C1E;
            border: 1px solid rgba(255, 215, 0, 0.5);
            border-radius: 10px 10px 0 0;
        }

        #main-menu-button {
      margin: 5px;
      padding: 5px 10px;
      font-size: 18px;
      cursor: pointer;
      background-color: #ffffff;
      color: rgb(51, 51, 51);
      border-radius: 5px;
      transition: all 0.1s ease-in-out;
      border: none;
      outline: 1px solid rgba(0, 0, 0, 0.1);
      outline-offset: -1px;
      box-shadow: 0 4px 0 #bbb;
      margin-left: auto;
    }

        

       #main-menu-button:active {
      box-shadow: 0 1px 8px #b7b7b7;
      transform: translateY(4px);
    }


        #chat-header {
            width: 100%;
            height: 10%;
            /* Стандартная высота шапки */
            background-color: #ffffff;
            /* Темный фон, как у меню */
            color: rgb(0, 0, 0);
            display: flex;

        }

        #chat-header-text {
            font-size: 18px;
            font-weight: 600;
            text-align: left;
            padding-top: 2%;
            padding-left: 20px;
        }
    </style>

    <!-- НОВЫЕ СТИЛИ ТОЛЬКО ДЛЯ ЧАТА -->
    <style>
        #reviews-chat-area {
            width: 100%;
            flex-grow: 1;
            /* Занимает все свободное пространство */
            overflow-y: auto;
            padding: 15px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;

        }

        .chat-message {
            display: flex;
            margin-bottom: 12px;
            max-width: 90%;
            align-self: flex-start;
        }

        .chat-content {
            background-color: #ffffff;
            /* Нейтральный фон для сообщений */
            color: #000;
            border-radius: 18px;
            padding: 10px 15px;
            text-align: left;
        }

        .chat-nikname {
            font-size: 14px;
            font-weight: bold;
            color: #0078FF;
            /* Яркий синий для имени */
            margin: 0 0 4px 0;
        }

        .chat-rev {
            font-size: 16px;
            line-height: 1.4;
            margin: 0;
        }

        .chat-message.align-right {
            align-self: flex-end;
        }

        /* Новый цвет фона для правых сообщений */
        .chat-message.align-right .chat-content {
            background-color: #dcf8c6;
            /* Светло-зеленый, как в мессенджерах */
        }

        #reviews-chat-area>.chat-message:first-child {
            margin-top: auto;
        }

        #reviews-img {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
        }
    </style>
</head>

<body>
    <div id="gameContainer">
        <div id="chat-header">
            <p id="chat-header-text">Кимчи Хангуго Отзывы</p>
        </div>
        <!-- НОВЫЙ БЛОК ДЛЯ ОТОБРАЖЕНИЯ ОТЗЫВОВ -->
        <div id="reviews-chat-area">
            <!-- Сюда будут загружаться отзывы -->
        </div>

        <!-- ВАША ОРИГИНАЛЬНАЯ HTML-СТРУКТУРА МЕНЮ -->
        <div id="menu-button-container">
            <div id="reviews-img">
                <img src="videothemes/icons/reviews.png" alt="reviews" style="width: 80px; height: 80px;">
            </div>
            <!-- Кнопка "в копилку" удалена, т.к. она относится к игровой логике, а не навигации -->
            <button id="main-menu-button" class="nav-button" onclick="goHome()">
                <img src="videothemes/icons/home.png" alt="Home" style="width: 45px; height: 45px;">
            </button>
            
        </div>
    </div>

    <script>
        // ЛОГИКА ДЛЯ МЕНЮ
        const Game = { stars: 0 };

        function goBack() {
            window.history.back();
        }

        function goHome() {
            window.location.href = "videothemes.html";
        }



        // НОВАЯ ЛОГИКА ДЛЯ ЗАГРУЗКИ ОТЗЫВОВ
        async function loadReviews() {
            const container = document.getElementById('reviews-chat-area');
            try {
                const response = await fetch('videothemes/json/videoreviews.json?nocache=' + Date.now());
                const reviews = await response.json();

                container.innerHTML = '';

                reviews.forEach(review => {
                    const messageElement = document.createElement('div');
                    messageElement.className = 'chat-message';

                    let reviewText = '';

                    // Создаем HTML, чтобы потом найти внутренний элемент
                    messageElement.innerHTML = `
                <div class="chat-content">
                    <p class="chat-nikname"></p>
                    <p class="chat-rev"></p>
                </div>
            `;

                    // Находим внутренние элементы для заполнения
                    const contentDiv = messageElement.querySelector('.chat-content');
                    const niknameP = messageElement.querySelector('.chat-nikname');
                    const revP = messageElement.querySelector('.chat-rev');

                    if (review.rev1) {
                        messageElement.classList.add('align-right');
                        reviewText = review.rev1;
                        // Применяем стиль к правому нижнему углу
                        contentDiv.style.borderBottomRightRadius = '0px';
                    }
                    else if (review.rev2) {
                        reviewText = review.rev2;
                        // Применяем стиль к левому нижнему углу
                        contentDiv.style.borderBottomLeftRadius = '0px';
                    }

                    // Заполняем текстом и добавляем на страницу
                    if (reviewText) {
                        niknameP.innerText = review.nikname;
                        revP.innerHTML = reviewText;
                        container.appendChild(messageElement);
                    }
                });

                // Добавляем класс для прижатия сообщений к низу
                const firstMessage = container.querySelector('.chat-message:first-child');
                if (firstMessage) {
                    firstMessage.style.marginTop = 'auto';
                }

            } catch (error) {
                console.error('Не удалось загрузить отзывы:', error);
                container.innerHTML = '<p style="color: grey; width: 100%;">Ошибка загрузки отзывов.</p>';
            }
        }

        // ВЫЗОВ ФУНКЦИЙ ПРИ ЗАГРУЗКЕ СТРАНИЦЫ
        document.addEventListener("DOMContentLoaded", () => {

            loadReviews();
        });
    </script>
</body>

</html>
