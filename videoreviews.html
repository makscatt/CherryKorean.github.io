<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Отзывы</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="analytics.js"></script>

    <!-- СТИЛИ СТРАНИЦЫ -->
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            background-color: #000000;
            font-family: 'NetflixSans-Regular', Arial, sans-serif;
            overflow: hidden;
            /* Важно, чтобы скролл был только внутри чата */
        }

        #gameContainer {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            /* Изменено с center на flex-start */
            align-items: center;
            text-align: center;
            position: relative;
            margin: auto;
            width: 100vw;
            height: 100vh;
            padding-top: 0px;
            background-image: url('videothemes/reviewsbackground.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        @media (hover: hover) and (pointer: fine) {
            #gameContainer {
                max-width: 600px;
                margin: 0 auto;
                border-left: 1px solid #333;
                border-right: 1px solid #333;
            }
        }

        /* --- ШАПКА --- */
        #chat-header {
            width: 100%;
            height: 60px;
            /* Фиксированная высота шапки */
            flex-shrink: 0;
            /* Шапка не сжимается */
            background-color: rgba(255, 255, 255, 0.95);
            color: rgb(0, 0, 0);
            display: flex;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            z-index: 10;
        }

        #chat-header-text {
            font-size: 18px;
            font-weight: 600;
            text-align: left;
            padding-left: 20px;
            margin: 0;
        }

        /* --- ОБЛАСТЬ ЧАТА --- */
        #reviews-chat-area {
            width: 100%;
            flex-grow: 1;
            /* Занимает всё оставшееся место */
            overflow-y: auto;
            /* Скролл только здесь */
            padding: 15px;
            padding-bottom: 120px;
            /* Отступ снизу, чтобы кнопки не перекрывали контент */
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }

        /* Скроллбар для красоты */
        #reviews-chat-area::-webkit-scrollbar {
            width: 5px;
        }

        #reviews-chat-area::-webkit-scrollbar-thumb {
            background-color: rgba(255, 255, 255, 0.3);
            border-radius: 5px;
        }

        .chat-message {
            display: flex;
            margin-bottom: 12px;
            max-width: 90%;
            align-self: flex-start;
        }

        .chat-content {
            background-color: #ffffff;
            color: #000;
            border-radius: 18px;
            padding: 10px 15px;
            text-align: left;
            box-shadow: 0 2px 2px rgba(0, 0, 0, 0.1);
        }

        .chat-nikname {
            font-size: 14px;
            font-weight: bold;
            color: #0078FF;
            margin: 0 0 4px 0;
        }

        .chat-rev {
            font-size: 16px;
            line-height: 1.4;
            margin: 0;
        }

        .chat-message.align-right {
            align-self: flex-end;
        }

        .chat-message.align-right .chat-content {
            background-color: #dcf8c6;
        }

        #reviews-chat-area>.chat-message:first-child {
            margin-top: auto;
        }

        /* --- НОВЫЕ СТИЛИ КНОПОК (Floating Controls) как в game_words.html --- */
        .floating-controls {
            position: fixed;
            bottom: 50px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            /* Отступ между кнопками, если их будет несколько */
            z-index: 2000;
        }

        .float-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.1s;
            padding: 0;
            outline: none;
            background: #ffffff;
            color: #333;
        }

        .float-btn:active {
            transform: scale(0.95);
        }

        /* Кнопка Домой */
        .btn-home {
            background-image: url('videothemes/icons/home.png');
            background-size: 60%;
            background-repeat: no-repeat;
            background-position: center;
        }

        /* Кнопка Назад (на случай, если захотите добавить) */
        .btn-back {
            background-image: url('videothemes/icons/backarrow.png');
            background-size: 60%;
            background-repeat: no-repeat;
            background-position: center;
        }
    </style>
</head>

<body>
    <div id="gameContainer">
        <div id="chat-header">
            <p id="chat-header-text">Кимчи Хангуго Отзывы</p>
        </div>

        <!-- БЛОК ДЛЯ ОТОБРАЖЕНИЯ ОТЗЫВОВ -->
        <div id="reviews-chat-area">
            <!-- Сюда будут загружаться отзывы -->
        </div>

        <!-- НОВОЕ ПЛАВАЮЩЕЕ МЕНЮ (как в game_words) -->
        <div class="floating-controls">
            <!-- Если нужна кнопка назад, раскомментируйте строку ниже -->
            <!-- <button class="float-btn btn-back" onclick="goBack()"></button> -->
            <button class="float-btn btn-home" onclick="goHome()"></button>
        </div>
    </div>

    <script>

        const SoundFX = {
            ctx: null,
            init: function () {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            },
            playTone: function (freq, type, duration, delay = 0, vol = 0.1) {
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime + delay);
                gain.gain.setValueAtTime(vol, this.ctx.currentTime + delay);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + delay + duration);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(this.ctx.currentTime + delay);
                osc.stop(this.ctx.currentTime + delay + duration);
            },
            playClick: function () {
                this.playTone(800, 'sine', 0.05, 0, 0.05);
            }
        };

        // Глобальный слушатель кликов
        document.addEventListener('click', function (e) {
            const target = e.target.closest('button, .float-btn');
            if (target) {
                SoundFX.playClick();
            }
        });
        // ЛОГИКА ДЛЯ МЕНЮ
        const Game = { stars: 0 };

        function goBack() {
            window.history.back();
        }

        function goHome() {
            window.location.href = "menu.html";
        }

        // ЛОГИКА ДЛЯ ЗАГРУЗКИ ОТЗЫВОВ
        async function loadReviews() {
            const container = document.getElementById('reviews-chat-area');
            try {
                const response = await fetch('videothemes/json/videoreviews.json?nocache=' + Date.now());
                const reviews = await response.json();

                container.innerHTML = '';

                reviews.forEach(review => {
                    const messageElement = document.createElement('div');
                    messageElement.className = 'chat-message';

                    let reviewText = '';

                    messageElement.innerHTML = `
                        <div class="chat-content">
                            <p class="chat-nikname"></p>
                            <p class="chat-rev"></p>
                        </div>
                    `;

                    const contentDiv = messageElement.querySelector('.chat-content');
                    const niknameP = messageElement.querySelector('.chat-nikname');
                    const revP = messageElement.querySelector('.chat-rev');

                    if (review.rev1) {
                        messageElement.classList.add('align-right');
                        reviewText = review.rev1;
                        contentDiv.style.borderBottomRightRadius = '0px';
                    }
                    else if (review.rev2) {
                        reviewText = review.rev2;
                        contentDiv.style.borderBottomLeftRadius = '0px';
                    }

                    if (reviewText) {
                        niknameP.innerText = review.nikname;
                        revP.innerHTML = reviewText;
                        container.appendChild(messageElement);
                    }
                });

                // Прижатие к низу
                const firstMessage = container.querySelector('.chat-message:first-child');
                if (firstMessage) {
                    firstMessage.style.marginTop = 'auto';
                }

                // Автоскролл вниз после загрузки
                setTimeout(() => {
                    container.scrollTop = container.scrollHeight;
                }, 100);

            } catch (error) {
                console.error('Не удалось загрузить отзывы:', error);
                container.innerHTML = '<p style="color: grey; width: 100%;">Ошибка загрузки отзывов.</p>';
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            loadReviews();
            // Настройка Telegram WebApp
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.expand();
                window.Telegram.WebApp.enableClosingConfirmation();
            }
        });
    </script>
</body>

</html>
