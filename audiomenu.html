<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Стартовый экран</title>
     <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="/trackActivity.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
        }

        /* Контейнер для игры */
        #wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
          /*  border: 1px solid #ff006f;*/
          

        }

        /* Контейнер с соотношением сторон 9:16 */
        #startScreen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background-color: #F7F6F6;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            position: relative;
            margin: auto;
            width: 90vw; /* Используем относительную единицу измерения */
            height: auto;
            aspect-ratio: 9 / 16;
            max-width: 400px;
            max-height: 90vh; /* Используем относительную единицу измерения */
            overflow: hidden; /* Добавляем, чтобы изображение не выходило за пределы контейнера */
        }

        /* Контейнер для фонового изображения, который адаптируется к экрану */
        #backgroundImageContainer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Само фоновое изображение */
        #backgroundImage {
            width: 100%;
            height: 100%; /* Устанавливаем высоту на 100% */
            object-fit: cover; /* Заполняем контейнер, сохраняя соотношение сторон */
            filter: blur(2px);
        }

        /* Контейнер для кнопок */
        #buttonsContainer {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative; /* Оставляем поверх изображения */
            z-index: 1; /* Обеспечивает расположение поверх фонового изображения */
         /*   border: 1px solid #ff0000; */
        }

        /* Контейнер для двух рядов кнопок */
        .buttonsRow {
            display: flex;
            justify-content: center;
            margin: 10px 0; /* Отступ между рядами */
        }

        /* Стили для кнопок */
        .startButton {
            width: 150px;
            height: 150px;
            margin: 0 10px; /* Отступ между кнопками в ряду */
            cursor: pointer;
        }
        .startButton:active {
    transform: scale(0.9); /* Уменьшаем кнопку при нажатии */
    transition: transform 0.1s ease-in-out; /* Плавный переход */
}
        #menu-button-container {
    position: absolute;
    bottom: 10px;
    height: 70px; /* Фиксированная высота */
    display: flex;
    justify-content: center; /* Центрируем элементы */
    align-items: center;
    width: 100%; /* Растягиваем контейнер на всю ширину */
 margin: 5;
 left: 0; /* Чтобы зафиксировать по ширине */
 right: 0; /* Чтобы зафиксировать по ширине */
    /* border: 1px solid #ddd; */
}
#menu-button {
    position: absolute;
    right: 20px;
    bottom: 20px;
    padding: 10px 15px;
    font-size: 20px;
    background-color: #ffffff;
    color: rgb(32, 32, 32);
    border: none;
    border-radius: 20px;
    cursor: pointer;
    z-index: 1001; /* Поверх всех элементов */
    box-shadow: 0px 2px 5px rgba(0, 0, 0, 0.2);
}
#menu-button:active {
    transform: scale(0.95); /* Уменьшение при нажатии */
    box-shadow: 0px 1px 3px rgba(0, 0, 0, 0.2); /* Уменьшение тени */
}
    </style>
</head>
<body>
    <!-- Оборачиваем в #wrapper -->
    <div id="wrapper">
        <div id="startScreen">
            <!-- Контейнер для фонового изображения -->
            <div id="backgroundImageContainer">
                <img src="startscreenBG.png" alt="Фоновое изображение" id="backgroundImage">
            </div>

            <!-- Контейнер для кнопок -->
            <div id="buttonsContainer">
                <div class="buttonsRow">
                    <!-- Первая строка кнопок -->
                    <!--<img src="button1.png" alt="Отгадай перевод" class="startButton" onclick="startGame('translate')">-->
                     <img src="button5.png" alt="На слух" class="startButton" onclick="startGame('audio')">
                </div>
                <div class="buttonsRow">
                    <!-- Вторая строка кнопок -->
                   <!-- <img src="button3.png" alt="По картинкам" class="startButton" onclick="startGame('pictures')">-->
                   <img src="button3.png" alt="Качать слух" class="startButton" onclick="startGame('audiobox')">
                     <!-- <img src="button4.png" alt="Карточки" class="startButton" onclick="startGame('training')">-->
                </div>
            </div>
            <div id="menu-button-container">                                  
                <div id="menu-button" onclick="showMenu()">Назад</div>
                </div>
        </div>
    </div>

    <script>

function showMenu() {
        window.location.href = 'index.html'; // Временная реализация для отображения, что меню открыто
        playPushButton();
    }
    function playPushButton(){
    var pushAudio = new Audio('pushButton.mp3');
        pushAudio.play();
}
function startGame(gameMode) {
    if (gameMode === 'translate') {
        window.location.href = "textwords.html";
        playPushButton();
    } else if (gameMode === 'audio') {
        window.location.href = "audiothemes.html";
        playPushButton();
    } else if (gameMode === 'audiobox') {
        window.location.href = "audiobox.html";
        playPushButton();
    } else if (gameMode === 'training') {
        window.location.href = "themes.html";
    }
}

if (window.Telegram.WebApp) {
    Telegram.WebApp.expand();
}
    </script>
</body>
</html>
