<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Рейтинг</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="font.css" />

  <link rel="stylesheet" href="minimenu.css">

  <style>
    @font-face {
      font-family: 'NetflixSans-Regular';
      src: url('./NetflixSans-Regular.otf') format('opentype');
      font-weight: normal;
      font-style: normal;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: black;
      color: white;
      font-family: Arial, sans-serif;
    }

    #gameContainer {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
      margin: auto;
      width: 100vw;
      /* Используем относительную единицу измерения */
      height: 100vh;
      padding-top: 0px;
      background-color: #000000;

    }

    @media (hover: hover) and (pointer: fine) {

      #gameContainer {
        max-width: 600px;
        margin: 0 auto;
      }
    }

    #rating-title {
      margin-top: 50px;

    }

    .rating-info {
      margin-top: 8px;
      /* отступ сверху */
      font-size: 16px;
      /* можно подкорректировать */
      color: #ccc;
      /* светло-серая, чтобы не «кричало» */
      text-align: center;
      /* по центру под заголовком */
    }

    #menu-button-container {
      gap: 10px;
      margin-top: 10px;
      height: 70px;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      background-color: #1E88E5;
      border-radius: 10px;
    }

    button {
      margin: 5px;
      padding: 5px 10px;
      font-size: 18px;
      cursor: pointer;
      background-color: #ffffff;
      color: rgb(51, 51, 51);
      border-radius: 5px;
      transition: all 0.1s ease-in-out;
      border: none;
      box-shadow: 0px 0px 8px rgba(0, 0, 0, 0.2);
    }

    button:active {
      box-shadow: 0 1px 8px #b7b7b7;
      transform: translateY(4px);
    }

    #rating-container {
      display: none;
      width: 100%;
      height: 100%;


      overflow-y: auto;
      scrollbar-width: none;
      /* Firefox */
    }

    #rating-container::-webkit-scrollbar {
      display: none;
      /* Chrome, Safari */
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
      font-size: 28px;
    }

    .user-entry {
      display: flex;
      justify-content: space-between;
      background-color: #1f1f1f;
      padding: 10px 15px;
      margin-bottom: 10px;
      border-radius: 10px;
      font-size: 18px;
    }

    .rank {
      font-weight: bold;
      color: #ffcc00;
    }

    .username {
      flex: 1;
      text-align: left;
      margin-left: 10px;
    }

    .stars {
      font-weight: bold;
      color: #00ffcc;
    }

    .current-user {
      background-color: #006666;
      border: 2px solid #00ffff;
    }

    #loading-spinner {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100%;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 9999;
      background-color: black;
    }

    .spinner {
      border: 6px solid #444;
      border-top: 6px solid #ffffff;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>

  <div id="loading-spinner"
    style="display: flex; justify-content: center; align-items: center;  z-index: 9999; height: 100vh;">
    <div class="spinner"></div>
  </div>

  <div id="gameContainer">
    <div id="rating-title">
      <h1>🏆 Рейтинг</h1>
      <p class="rating-info">Новый рейтинг начинается каждый понедельник</p>
    </div>
    <div id="rating-container">

      <!-- Сюда будут добавлены участники -->
    </div>
    <div id="menu-button-container">
      <button id="main-menu-button" class="nav-button" onclick="goHome()">
        <img src="videothemes/icons/home.png" alt="Home" style="width: 45px; height: 45px;">
      </button>
    </div>
  </div>

  <script>
    document.getElementById('main-menu-button').addEventListener('click', () => {
      window.location.href = 'videothemes.html';
    });

    document.addEventListener("DOMContentLoaded", async () => {
      const container = document.getElementById("rating-container");
      const currentUser = Telegram.WebApp.initDataUnsafe.user;
      const currentId = String(currentUser?.id || "");

      try {
        const response = await fetch("https://telegram-server-hfk7.onrender.com/getWeeklyStars");
        const users = await response.json();

        document.getElementById("loading-spinner").style.display = "none";
        document.getElementById("rating-container").style.display = "block";

        users.sort((a, b) => (b.stars || 0) - (a.stars || 0));

        let rank = 1;
        users.forEach((user) => {
          if (user.telegramId === "1060731645" || user.telegramId === "910912532") return;
          const isCurrent = String(user.telegramId) === currentId;

          const entry = document.createElement("div");
          entry.className = "user-entry";
          if (isCurrent) entry.classList.add("current-user");

          entry.innerHTML = `
      <div class="rank">${rank}</div>
      <div class="username">${user.username}</div>
      <div class="stars">⭐ ${user.stars || 0}</div>
    `;

          container.appendChild(entry);
          rank++;
        });
      } catch (err) {
        console.error("Ошибка загрузки рейтинга:", err);
        container.innerHTML += `<p style="text-align:center;color:red;">Ошибка загрузки данных</p>`;
      }
    });


  </script>
</body>

</html>
