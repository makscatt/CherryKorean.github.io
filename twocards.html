<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карточки на память</title>
    <!-- СКРИПТ TELEGRAM WEB APP -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="minimenu.css">
    <style>
        body {
            margin: 0;
            font-family: sans-serif;
            /* Фон для всей страницы */
        }

        #gameContainer {
            display: flex;
            flex-direction: column;
            /*justify-content: center;*/
            align-items: center;
            text-align: center;
            position: relative;
            margin: auto;
            width: 100vw;
            /* Используем относительную единицу измерения */
            height: 100vh;
            padding-top: 0px;
            background-image: url('twocards/background.png');
            /* Путь к файлу */
            background-size: cover;
            /* Растянуть, чтобы заполнить контейнер */
            background-position: center;
            /* Центрировать изображение */
            background-repeat: no-repeat;
            /* Не повторять */

        }

        #game-content-wrapper {
            flex-grow: 1;
            /* Позволяет этому блоку занять все доступное пространство */
            display: flex;
            flex-direction: column;
            justify-content: center;
            /* Центрирует игровой контент вертикально */
            align-items: center;
            /* Центрирует игровой контент горизонтально */
            width: 100%;
            /* Занимает всю ширину родителя */
        }

        @media (hover: hover) and (pointer: fine) {
            #gameContainer {
                max-width: 600px;
                margin: 0 auto;
            }
        }

        #gameStatus {
            color: #fff;
            font-size: 1.5em;
            margin-bottom: 20px;
            height: 50px;
        }

        #gameBoard {
            display: grid;
            gap: 5px;
            max-width: 350px;
            /* max-width можно оставить или тоже убрать */
            perspective: 1000px;
            transition: opacity 0.3s, width 0.4s ease-in-out;
            /* Добавим плавный переход для ширины */
        }

        .card {
            width: 100%;
            aspect-ratio: 297 / 440;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.3s;
            cursor: pointer;
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card-face,
        .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card-back {
            background-image: url('twocards/cardback.png');
            background-size: cover;
            background-position: center;
        }

        .card-face {
            background-color: #f5f5f5;
            transform: rotateY(180deg);
        }

        .card-face img {
            width: 100%;
            height: 100%;
            object-fit: fill;
            border-radius: 8px;
        }

        .card.matched {
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.5s, visibility 0s 0.5s;
        }


        #restartButton {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 1em;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background-color: #4CAF50;
            /* Зеленый цвет */
            color: white;
        }

        #restartButton:disabled {
            background-color: #9E9E9E;
            cursor: not-allowed;
        }

        /* --- СТИЛИ НИЖНЕГО МЕНЮ ИЗ ВАШЕГО КОДА --- */
        #menu-button-container {
            position: relative;
            max-width: 100%;
            gap: 10px;
            margin-top: auto;

            height: 10%;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            background-color: #1C1C1E;
            border: 1px solid rgba(255, 215, 0, 0.5);
            border-radius: 10px 10px 0 0;
        }

        @media (hover: hover) and (pointer: fine) {
            #menu-button-container {
                max-width: 600px;
                margin: 0 auto;
            }
        }

        #main-menu-button {
            display: flex;
            align-items: center;
            justify-content: center;
            position: absolute;
            right: 80px;
            top: 50%;
            transform: translateY(-58%);
            padding: 1px 6px;

        }

        #back-button {
            padding: 1px 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: absolute;
            right: 5px;
            top: 50%;
            transform: translateY(-58%);
        }

        #back-button:active,
        #main-menu-button:active {
            transform: translateY(-54%);
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
        }

        #stars {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 24px;
            color: white;
            background: none;
            border: none;
            box-shadow: none;
            cursor: default;
            padding: 0;
            line-height: 1;
        }

        button {
            margin: 5px;
            padding: 10px 10px;
            font-size: clamp(20px, 3vw, 30px);
            cursor: pointer;
            background-color: #ffffff;
            color: rgb(51, 51, 51);
            border-radius: 5px;
            transition: all 0.1s ease-in-out;
            border: none;
            box-shadow: 0 4px 0 #bbb;
        }

        button:active {
            box-shadow: 0 1px 4px #b7b7b7;
            transform: translateY(4px);
        }
    </style>
</head>

<body>
    <div id="gameContainer">
        <div id="game-content-wrapper">
            <div id="gameStatus">Загрузка...</div>
            <div id="gameBoard"></div>
            <button id="restartButton" disabled>Играть</button>
        </div>

        <!-- НИЖНЕЕ МЕНЮ ИЗ ВАШЕГО КОДА -->
        <div id="menu-button-container">

            <button id="stars" disabled>⭐ 0</button>


            <button id="main-menu-button" class="nav-button" onclick="goHome()">
                <img src="videothemes/icons/home.png" alt="Home" style="width: 45px; height: 45px;">
            </button>
            <button id="back-button" class="nav-button" onclick="goBack()">
                <img src="videothemes/icons/back.png" alt="Back" style="width: 45px; height: 45px;">
            </button>
        </div>
    </div>

    <script>
        const gameBoard = document.getElementById('gameBoard');
        const gameStatus = document.getElementById('gameStatus');
        const restartButton = document.getElementById('restartButton');
        const Game = { stars: 0 };
        let COST_TO_PLAY = 5;

        const levelConfig = [
            { pairs: 2, gridTemplate: 'repeat(2, 1fr)', boardWidth: '55%' },
            { pairs: 4, gridTemplate: 'repeat(4, 1fr)', boardWidth: '90%' },
            { pairs: 8, gridTemplate: 'repeat(4, 1fr)', boardWidth: '90%' },
            { pairs: 12, gridTemplate: 'repeat(6, 1fr)', boardWidth: '95%' }
        ];
        let currentLevel = 0;

        let loadedSymbols = [];
        let cardsArray = [];
        let flippedCards = [];
        let matchedPairs = 0;
        let lockBoard = false;
        let gameIsOver = false;

        // --- НОВЫЕ ПЕРЕМЕННЫЕ ДЛЯ ХОДОВ ---
        let movesMade = 0;
        let totalAllowedMoves = 0;
        // ---------------------------------

        async function loadStars() {
            try {
                const localStars = localStorage.getItem("stars");
                if (localStars) {
                    Game.stars = parseInt(localStars, 10);
                    updateStarsUI();
                }
                const user = Telegram.WebApp.initDataUnsafe?.user;
                if (!user?.id) return;
                const response = await fetch(`https://telegram-server-hfk7.onrender.com/load/${user.id}`);
                const data = await response.json();
                if (data && typeof data.stars !== "undefined") {
                    Game.stars = parseInt(data.stars, 10);
                }
            } catch (e) {
                console.error("Ошибка загрузки звёзд с сервера:", e);
            } finally {
                updateStarsUI();
            }
        }

        function saveStars() {
            localStorage.setItem("stars", Game.stars);
            try {
                const user = Telegram.WebApp.initDataUnsafe?.user;
                if (!user?.id) return;
                fetch("https://telegram-server-hfk7.onrender.com/save", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ telegramId: user.id, username: user.username, stars: Game.stars })
                }).catch(err => console.error("Ошибка сохранения звёзд на сервер:", err));
            } catch (e) {
                console.error("Ошибка при отправке звёзд:", e);
            }
        }

        function updateStarsUI() {
            document.getElementById("stars").innerText = `⭐ ${Game.stars}`;
        }

        function goHome() {
            new Audio('pushButton.mp3').play();
            setTimeout(() => {
                window.location.href = "videothemes.html";
            }, 150);
        }
        function goBack() {
            window.history.back();
        }

        async function initGame() {
            await loadStars();
            restartButton.addEventListener('click', handlePlayAgain);

            // Сначала определяем стоимость
            const blockKey = localStorage.getItem('selectedVideoBlock');
            if (blockKey === 'b3') {
                COST_TO_PLAY = 10;
            }

            // Затем проверяем, хватает ли звезд, и обновляем UI
            if (Game.stars < COST_TO_PLAY) {
                gameStatus.textContent = `Нужно ${COST_TO_PLAY} звезд для игры!`;
                gameBoard.style.opacity = '0.5';
                restartButton.disabled = true;
                restartButton.textContent = "Недостаточно звезд";
                return; // Выходим, если играть нельзя
            }

            // Если звезд хватает, настраиваем кнопку и статус
            gameStatus.textContent = `Игра стоит ${COST_TO_PLAY} звезд`;
            restartButton.disabled = false;
            restartButton.textContent = `Играть (-${COST_TO_PLAY}⭐)`;

            // И только потом загружаем данные карт
            try {
                if (!blockKey) throw new Error("Блок не выбран. Вернитесь назад.");

                const response = await fetch('twocards/twocards.json');
                const allData = await response.json();
                const blockData = allData[blockKey];

                if (!blockData || blockData.length === 0) throw new Error(`Данные для этой темы еще не добавлены.`);

                loadedSymbols = blockData.map(item => item.card);
                if (loadedSymbols.length < 12) {
                    gameStatus.textContent = 'В этой теме пока недостаточно карт!';
                    restartButton.disabled = true;
                }
            } catch (error) {
                gameStatus.textContent = error.message || 'Ошибка загрузки карт!';
                console.error(error);
                restartButton.disabled = true;
            }
        }

        // --- ИЗМЕНЕНА ---
        function handlePlayAgain() {
            if (Game.stars < COST_TO_PLAY) {
                gameStatus.textContent = `Нужно ${COST_TO_PLAY} звезд!`;
                restartButton.disabled = true;
                return;
            }
            Game.stars -= COST_TO_PLAY;
            updateStarsUI();
            saveStars();

            // Сброс счетчиков игры
            movesMade = 0;
            const idealMoves = 2 + 4 + 8 + 12; // 26
            totalAllowedMoves = 60; // Даем 60 ходов на всю игру
            gameIsOver = false;
            currentLevel = 0;
            startLevel();
        }

        function shuffle(array) {
            array.sort(() => Math.random() - 0.5);
        }

        // --- ИЗМЕНЕНА ---
        function startLevel() {
            resetBoard();
            gameBoard.style.display = 'grid';

            const config = levelConfig[currentLevel];
            gameBoard.style.gridTemplateColumns = config.gridTemplate;
            gameBoard.style.width = config.boardWidth;

            matchedPairs = 0;
            // Обновляем статус с учетом ходов
            gameStatus.textContent = `Уровень ${currentLevel + 1} | Ходов: ${totalAllowedMoves - movesMade}`;
            gameBoard.innerHTML = '';

            shuffle(loadedSymbols);
            const levelSymbols = loadedSymbols.slice(0, config.pairs);
            cardsArray = [...levelSymbols, ...levelSymbols];
            shuffle(cardsArray);

            cardsArray.forEach(symbol => {
                const card = document.createElement('div');
                card.classList.add('card');
                card.dataset.symbol = symbol;
                card.innerHTML = `
                <div class="card-face"><img src="${symbol}" alt="card-icon"></div>
                <div class="card-back"></div>
            `;
                card.addEventListener('click', flipCard);
                gameBoard.appendChild(card);
            });

            restartButton.disabled = true;
        }

        function flipCard() {
            if (lockBoard || this.classList.contains('flipped') || this.classList.contains('matched') || gameIsOver) return;
            this.classList.add('flipped');
            if (flippedCards.length === 0) {
                flippedCards.push(this);
                return;
            }
            if (flippedCards.length === 1) {
                flippedCards.push(this);
                lockBoard = true;
                checkForMatch();
            }
        }

        // --- ИЗМЕНЕНА ---
        function checkForMatch() {
            movesMade++; // Считаем ход
            const isMatch = flippedCards[0].dataset.symbol === flippedCards[1].dataset.symbol;
            gameStatus.textContent = `Уровень ${currentLevel + 1} | Ходов: ${totalAllowedMoves - movesMade}`;
            isMatch ? disableCards() : unflipCards();
        }

        // --- НОВАЯ ФУНКЦИЯ ---
        function handleLoss() {
            if (gameIsOver) return;
            gameIsOver = true;
            lockBoard = true;
            gameStatus.textContent = `Ходы закончились! Попробуй снова.`;
            gameBoard.style.display = 'none'; // Прячем доску
            restartButton.disabled = false;
            restartButton.textContent = `Начать заново (-${COST_TO_PLAY}⭐)`;
        }

        // --- ИЗМЕНЕНА ---
        function disableCards() {
            matchedPairs++;
            const config = levelConfig[currentLevel];

            setTimeout(() => {
                flippedCards.forEach(card => card.classList.add('matched'));
                resetBoard();

                if (matchedPairs === config.pairs) {
                    currentLevel++;
                    if (currentLevel < levelConfig.length) {
                        gameStatus.textContent = `Отлично! Готовься к уровню ${currentLevel + 1}`;
                        setTimeout(startLevel, 1500);
                    } else {
                        gameIsOver = true;
                        gameStatus.textContent = 'Победа! 🎉';
                        gameBoard.style.display = 'none';
                        restartButton.disabled = false;
                        restartButton.textContent = `Играть еще (-${COST_TO_PLAY}⭐)`;
                    }
                } else if (movesMade >= totalAllowedMoves) { // Проверяем на проигрыш после успешного хода
                    handleLoss();
                }
            }, 500);
        }

        // --- ИЗМЕНЕНА ---
        function unflipCards() {
            setTimeout(() => {
                flippedCards.forEach(card => card.classList.remove('flipped'));
                resetBoard();
                // Проверяем на проигрыш после неудачного хода
                if (movesMade >= totalAllowedMoves) {
                    handleLoss();
                }
            }, 800);
        }

        function resetBoard() {
            [flippedCards, lockBoard] = [[], false];
        }

        initGame();
    </script>
</body>

</html>
