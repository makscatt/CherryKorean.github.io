<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Стартовый экран</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="analytics.js"></script>
    <script src="/trackActivity.js"></script>


    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            background-color: black;
        }

        #fadeOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            opacity: 0;
            z-index: 10000;
            transition: opacity 0.4s ease;
            pointer-events: none;
        }

        @font-face {
            font-family: 'NetflixSans-Regular';
            src: url('./NetflixSans-Regular.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            width: 100vw;
            height: 100vh;
            font-family: 'NetflixSans-Regular', Arial, sans-serif;
        }

        /* Контейнер для фонового изображения, который адаптируется к экрану */
        #backgroundImageContainer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Само фоновое изображение */
        #backgroundImage {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Контейнер для кнопок */
        #buttonsContainer {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 1;
            /* Обеспечивает расположение поверх фонового изображения */
            width: 100%;
        }

        /* Стили для кнопок */
       .startButton {
            /* Шрифты и цвета */
            font-size: 35px;
            background-color: #FAD551;
            color: rgb(0, 0, 0);
            font-family: 'NetflixSans-Regular', Arial, sans-serif;
            cursor: pointer;
            border-radius: 10px;
            border: none;

            /* СКРЫТОЕ СОСТОЯНИЕ (начальное) */
            max-height: 0;        /* Высота 0 */
            padding: 0 30px;      /* Вертикальные отступы 0 */
            margin-top: 0;        /* Отступ от картинки 0 */
            opacity: 0;           /* Прозрачность 0 */
            overflow: hidden;     /* Скрываем контент, если он не влезает */
            box-shadow: none;     /* Тени нет */
            transform: translateY(20px); /* Слегка смещена вниз */

            /* ПЛАВНАЯ АНИМАЦИЯ ВСЕХ СВОЙСТВ */
            transition: 
                max-height 0.6s ease,
                padding 0.6s ease,
                margin-top 0.6s ease,
                opacity 0.6s ease,
                transform 0.6s ease,
                box-shadow 0.6s ease;
        }
        
        /* ВИДИМОЕ СОСТОЯНИЕ (добавляется через JS) */
        .startButton.visible {
            max-height: 100px;    /* Раскрываем высоту (с запасом) */
            padding: 10px 30px;   /* Возвращаем отступы */
            margin-top: 20px;     /* Возвращаем отступ от картинки */
            opacity: 1;           /* Делаем видимой */
            transform: translateY(0); /* Возвращаем на место */
            
            /* Возвращаем тень */
            box-shadow:
                inset 1px 1px 0 #fff,
                inset -1px -1px 0 #b38c00,
                2px 2px 4px rgba(0, 0, 0, 0.6);
        }

        .startButton:active {
            /* Эффект нажатия (работает только когда кнопка visible) */
            transform: translateY(4px);
            box-shadow:
                inset 4px 4px 0 #b38c00,
                inset -2px -2px 0 #FAD551;
            transition: transform 0.05s ease-in, box-shadow 0.05s ease-in;
        }

    </style>
</head>

<body>

    <!-- Контейнер для фонового изображения -->
    <div id="backgroundImageContainer">
        <img src="startscreenBGnew.png" alt="Фоновое изображение" id="backgroundImage">
    </div>

    <!-- Контейнер для кнопок -->
    <div id="buttonsContainer">
        <img src="app_name_1.png" alt="App Name" style="width: 80%; margin-bottom: 0px;">
        
        <!-- Кнопка добавлена сюда, изначально скрыта (display: none через JS логику или CSS) -->
        <button id="startBtn" class="startButton" style="display: none;">Начать</button>
    </div>

    <script>
        

        function activityTrackerLoaded() {
            console.log("trackActivity.js загружен и функция работает");
        }
        if (typeof activityTrackerLoaded === "function") {
            activityTrackerLoaded();
        } else {
            console.log("trackActivity.js не загрузился");
        }

        const initData = window.Telegram.WebApp.initDataUnsafe;
        const telegramId = initData?.user?.id || "test_user_123";

        // Получаем ссылку на кнопку
        const startBtn = document.getElementById('startBtn');

        // Обработчик клика по кнопке
        startBtn.addEventListener('click', () => {
            // Пробуем воспроизвести звук (браузеры разрешают звук только после действия пользователя)
            
            startGame();
        });

        if (!telegramId) {
            document.body.style.visibility = "visible";
            window.Telegram.WebApp.close();
        } else {
            // Запрос 1: проверка членства в группе (userId в теле)
            fetch(`https://telegram-server-hfk7.onrender.com/load/${telegramId}`)
                .then(res => res.json())
                .then(data => {
                    const isMember = data.promember === true || data.tgmembership === true;
                    if (isMember) {
                        localStorage.setItem("member", "true");
                    } else {
                        localStorage.setItem("member", "false");
                    }

                    // Трекинг пользователя
                    fetch('https://telegram-server-hfk7.onrender.com/track_user', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ userId: telegramId }),
                    });
                })
                .catch(() => {
                    localStorage.setItem("member", "false");
                })
                .finally(() => {
                    // КОГДА ВСЕ ПРОВЕРКИ ЗАВЕРШЕНЫ:
                    
                    // 1. Делаем кнопку активной в DOM
                    startBtn.style.display = 'block';
                    
                    // 2. Небольшая задержка для плавного появления (если используем CSS transition)
                    setTimeout(() => {
                        startBtn.classList.add('visible');
                    }, 50);
                });
        }

        // Анимация исчезновения фейда
        window.addEventListener('load', () => {
            const fade = document.getElementById('fadeOverlay');
            fade.style.opacity = '0';
            setTimeout(() => {
                fade.style.display = 'none';
            }, 500);
        });

        function startGame() {
            const fadeOverlay = document.getElementById('fadeOverlay');
            const backgroundImage = document.getElementById('backgroundImage');
            const buttonsContainer = document.getElementById('buttonsContainer');

            // Показываем оверлей перехода
            fadeOverlay.style.display = 'block'; 

            // Форсируем перерисовку перед изменением прозрачности
            void fadeOverlay.offsetWidth;

            backgroundImage.style.transition = 'opacity 0.4s ease';
            buttonsContainer.style.transition = 'opacity 0.4s ease';
            fadeOverlay.style.transition = 'opacity 0.4s ease';

            backgroundImage.style.opacity = '0';
            buttonsContainer.style.opacity = '0';
            fadeOverlay.style.opacity = '1';

            setTimeout(() => {
                window.location.href = "menu.html";
            }, 400);
        }

        if (window.Telegram.WebApp) {
            Telegram.WebApp.requestFullscreen();
        }

    </script>
    <div id="fadeOverlay"></div>
</body>

</html>
