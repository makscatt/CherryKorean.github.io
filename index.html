<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Стартовый экран</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="/trackActivity.js"></script>


    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            background-color: black;
        }



        #fadeOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            opacity: 0;
            z-index: 10000;
            transition: opacity 0.4s ease;
            pointer-events: none;
        }

        @font-face {
            font-family: 'NetflixSans-Regular';
            src: url('./NetflixSans-Regular.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }

        body {

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            width: 100vw;
            height: 100vh;
            font-family: 'NetflixSans-Regular', Arial, sans-serif;
        }




        /* Контейнер с соотношением сторон 9:16 */


        /* Контейнер для фонового изображения, который адаптируется к экрану */
        #backgroundImageContainer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Само фоновое изображение */
        #backgroundImage {
            width: 100%;
            height: 100%;
            /* Устанавливаем высоту на 100% */
            object-fit: cover;
            /* Заполняем контейнер, сохраняя соотношение сторон */
        }

        /* Контейнер для кнопок */
        #buttonsContainer {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            /* Оставляем поверх изображения */
            z-index: 1;
            /* Обеспечивает расположение поверх фонового изображения */
            transform: translateY(-100px);

        }

        /* Контейнер для двух рядов кнопок */
        .buttonsRow {
            display: flex;
            justify-content: center;
            margin: 10px 0;
            /* Отступ между рядами */
        }

        /* Стили для кнопок */
        .startButton {
            padding: 10px 15px;
            font-size: 35px;
            background-color: #FAD551;
            color: rgb(0, 0, 0);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-family: 'NetflixSans-Regular', Arial, sans-serif;

            box-shadow:
                inset 1px 1px 0 #fff,
                inset -1px -1px 0 #b38c00,
                2px 2px 4px rgba(0, 0, 0, 0.6);

        }

        .startButton:active {
            transform: translateY(4px);
            box-shadow:
                inset 4px 4px 0 #b38c00,
                inset -2px -2px 0 #FAD551;
            transition: transform 0.05s ease-in, box-shadow 0.05s ease-in;
        }

        .subscribe-button {

            padding: 10px 15px;
            font-size: 20px;
            background-color: #E50914;
            color: rgb(255, 255, 255);
            border: none;
            border-radius: 20px;
            cursor: pointer;
            z-index: 1001;
            /* Поверх всех элементов */

        }
    </style>
</head>

<body style="visibility: hidden">




    <!-- Контейнер для фонового изображения -->
    <div id="backgroundImageContainer">

        <img src="startscreenBGnew.png" alt="Фоновое изображение" id="backgroundImage">

    </div>

    <!-- Контейнер для кнопок -->
    <div id="buttonsContainer">

        <img src="app_name.png" alt="App Name" style="width: 70%; ">
        <div class="buttonsRow">
            <!-- Вторая строка кнопок -->
            <!-- <img src="button3.png" alt="По картинкам" class="startButton" onclick="startGame('pictures')">-->
            <!-- <img src="button2.png" alt="На слух" class="startButton" onclick="startGame('audiomenu')">-->
            <button class="startButton" onclick="startGame('video')">Начать</button>
        </div>
    </div>



    <script>



        const gameStartsSound = new Audio('game_starts.mp3');
        gameStartsSound.preload = 'auto';
        gameStartsSound.load();

        function activityTrackerLoaded() {
            console.log("trackActivity.js загружен и функция работает");
        }
        if (typeof activityTrackerLoaded === "function") {
            activityTrackerLoaded(); // Вызовет консольное сообщение, если функция загружена
        } else {
            console.log("trackActivity.js не загрузился");
        }

        const initData = window.Telegram.WebApp.initDataUnsafe;
        const telegramId = initData?.user?.id;

        if (!telegramId) {
            document.body.style.visibility = "visible";
            window.Telegram.WebApp.close();
        } else {
            // Запрос 1: проверка членства в группе (userId в теле)
            fetch(`https://telegram-server-hfk7.onrender.com/load/${telegramId}`)
                .then(res => res.json())
                .then(data => {
                    const isMember = data.promember === true || data.tgmembership === true;

                    if (isMember) {
                        localStorage.setItem("member", "true");
                    } else {
                        localStorage.setItem("member", "false");
                    }

                    // Трекинг пользователя
                    fetch('https://telegram-server-hfk7.onrender.com/track_user', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ userId: telegramId }),
                    });
                })
                .catch(() => {
                    localStorage.setItem("member", "false");
                })
                .finally(() => {
                    document.body.style.visibility = "visible"; // ← показываем страницу
                });

        }

        // Анимация исчезновения фейда
        window.addEventListener('load', () => {
            const fade = document.getElementById('fadeOverlay');
            fade.style.opacity = '0';
            setTimeout(() => {
                fade.style.display = 'none';
            }, 500);
        });


        function startGame() {
            const fadeOverlay = document.getElementById('fadeOverlay');
            const backgroundImage = document.getElementById('backgroundImage');
            const buttonsContainer = document.getElementById('buttonsContainer');

            backgroundImage.style.transition = 'opacity 0.4s ease';
            buttonsContainer.style.transition = 'opacity 0.4s ease';
            fadeOverlay.style.transition = 'opacity 0.4s ease';

            backgroundImage.style.opacity = '0';
            buttonsContainer.style.opacity = '0';
            fadeOverlay.style.opacity = '1';

            setTimeout(() => {
                window.location.href = "videothemes.html";
            }, 400);
        }


        if (window.Telegram.WebApp) {
            Telegram.WebApp.requestFullscreen();
        }

    </script>
    <div id="fadeOverlay"></div>
</body>

</html>
