<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Видео Тренировка</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="videoplayer.css">

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
        }

        body {

            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            background-color: #000000;
            font-family: 'NetflixSans-Regular', Arial, sans-serif;

        }

        .timer {
            display: none;
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 20px;
            font-weight: bold;
            color: #333;
            background-color: #ffffff;
            border-radius: 10px;
            box-shadow: 0px 2px 5px rgba(0, 0, 0, 0.2);
            z-index: 9998;
            height: 28px;
            padding: 10px 15px;
            border: none;
        }

        .overlay-timer {
            margin-left: 5px;

            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            /* Полупрозрачный черный фон */
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            z-index: 1000;
            /* Поверх всех элементов */
        }

        .timer img {
            transform: translateX(-20px) translateY(-30%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 70px;
            height: 70px;
            object-fit: contain;
            display: block;
            margin: auto;
        }

        .goldkimchi-label {
            position: absolute;
            top: -50px;
            left: 50%;
            transform: translateX(-30%);
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 16px;
            display: none;
            z-index: 9999;
            text-align: center;
            line-height: 1.4;
            min-width: 160px;
            max-width: 200px;
            white-space: normal;
            word-wrap: break-word;
        }

        #gameContainer {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
            margin: auto;
            width: 100vw;
            /* Используем относительную единицу измерения */
            height: 100vh;
            padding-top: 0px;
            background: linear-gradient(to bottom, #000000 30%, #ffffff 30%);

        }

        #video-container {
            max-width: 100%;
            border-radius: 10px;
            margin-top: 40px;
            width: 100%;
        }

        #custom-video-container {
            margin: 0;
            padding: 0;
            background-color: #000000;
        }

        #custom-video-container video {
            width: 100%;
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;

            margin: 0;


        }

        #interaction-block {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 100%;
            margin-top: clamp(1%, 5vw, 5%);
            margin-bottom: 1%;
            height: 50%;


        }

        button {
            margin: 5px;
            padding: 5px 10px;
            font-size: clamp(15px, 5vw, 50px);
            cursor: pointer;
            background-color: #ffffff;
            color: rgb(51, 51, 51);
            border-radius: 5px;
            transition: all 0.1s ease-in-out;
            border: none;
            box-shadow: 0px 0px 8px rgba(0, 0, 0, 0.2);
        }

        button:active {
            box-shadow: 0 1px 8px #b7b7b7;
            transform: translateY(4px);
        }

        #answer-buttons {
            display: flex;
            flex-direction: column;
            margin-top: 15px;
            margin: 10px;

            justify-content: space-between;
            gap: 10px;
            height: 110px;
            /* фиксированная высота */
        }

        #showKoreanButton {
            margin-top: 0px;
            font-size: clamp(15px, 5vw, 30px);
            height: clamp(50px, 5vw, 80px);
            margin: 0px;
            padding: 0px;
            width: 100%;
            opacity: 0.7;
        }

        #koreanText {
            display: none;
            margin: 0px;
            padding: 0px;
            font-size: clamp(15px, 5vw, 50px);
            background-color: #fff;
            height: clamp(50px, 5vw, 80px);
            border-radius: 10px;
            white-space: normal;
            overflow-wrap: break-word;
            word-break: keep-all;
            opacity: 0.8;
        }

        #progress-bar {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(10, 30px);
            gap: 2vw;
            justify-content: center;
            margin-top: clamp(1%, 4vw, 5%);
        }

        .progress-box {
            width: clamp(30px, 5vw, 40px);
            height: clamp(30px, 5vw, 40px);
            box-shadow: 0px 0px 8px rgba(0, 0, 0, 0.2);
            border-radius: 6px;
            background-color: white;

        }

        #menu-button-container {
            position: relative;
            max-width: 100%;
            gap: 10px;
            margin-top: auto;
            margin-bottom: 3px;
            height: 10%;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            background-color: #1E88E5;
            border-radius: 10px;
        }

        #stars {
            position: absolute;
            left: 85px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 20px;
            color: white;
            background: none;
            border: none;
            box-shadow: none;
            cursor: default;
            padding: 0;
            line-height: 1;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #stars.pulsing {
            animation: pulse 0.3s ease-out;
        }

        @keyframes pulse {
            0% {
                transform: translateY(-50%) scale(1);
            }

            50% {
                transform: translateY(-50%) scale(1.5);
            }

            100% {
                transform: translateY(-50%) scale(1);
            }
        }

        #main-menu-button {
            display: flex;
            align-items: center;
            justify-content: center;
            position: absolute;
            right: 80px;
            top: 50%;
            transform: translateY(-58%);
            padding: 1px 6px;

        }

        #back-button {
            padding: 1px 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: absolute;
            right: 5px;
            top: 50%;
            transform: translateY(-58%);
        }

        #save-to-bank-button {
            all: unset;
            cursor: pointer;
            width: 60px;
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto;
            position: absolute;
            left: 0;
            right: 0;
        }

        #save-to-bank-button:active {
            transform: scale(0.95);
            box-shadow: none;
        }

        #save-to-bank-button.active {
            background: none;
        }

        #bank-icon {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
    </style>
</head>

<body>
    <div id="gameContainer">
        <div id="video-container">
            <div id="custom-video-container">
                <video id="wordVideo" playsinline webkit-playsinline></video>
            </div>
            <div id="custom-controls-wrapper">
                <div id="custom-controls">
                    <button id="play-btn">
                        <img src="customcontrolbuttons/play.png" alt="Play">
                    </button>
                    <button id="repeat-btn">
                        <img src="customcontrolbuttons/repeat.png" alt="Repeat">
                    </button>
                    <select id="speed-select">
                        <option value="0.5">0.5x</option>
                        <option value="0.75">0.75x</option>
                        <option value="1" selected>1x</option>
                        <option value="1.25">1.25x</option>
                        <option value="1.5">1.5x</option>
                        <option value="2">2x</option>
                    </select>
                </div>
            </div>
        </div>
        <div id="interaction-block">
            <div id="answer-buttons">

                <button id="option1" onclick="checkWord(this)" style="flex: 1;"></button>
                <button id="option2" onclick="checkWord(this)" style="flex: 1;"></button>

                <div id="KoreanButton">
                    <button id="showKoreanButton" onclick="showKoreanText()">Показать корейский текст</button>
                    <p id="koreanText"></p>
                </div>
                <div id="progress-bar"></div>
            </div>
        </div>
        <div id="menu-button-container">
            <div class="timer">00:00</div>
            <button id="stars" disabled>⭐ 0</button>
            <button id="save-to-bank-button" onclick="saveToBank()">
                <img id="bank-icon" src="videothemes/icons/outbank.png" alt="В копилку">
            </button>
            <button id="main-menu-button" class="nav-button" onclick="goHome()">
                <img src="videothemes/icons/home.png" alt="Home" style="width: 45px; height: 45px;">
            </button>
            <button id="back-button" class="nav-button" onclick="goBack()">
                <img src="videothemes/icons/back.png" alt="Back" style="width: 45px; height: 45px;">
            </button>
        </div>
    </div>
    </div>
    <script>

        let correctAnswer = "";
        let progressCount = 0;
        const Game = { stars: 0 };
        let easywords = [];
        let currentWordIndex = null;
        let preloadedWord = null;
        let preloadedVideoSrc = null;
        let recentWords = [];
        const recentLimit = 10;

        function goBack() {
            window.history.back();
        }

        function saveStars() {
            try {
                const user = Telegram.WebApp.initDataUnsafe?.user;
                const telegramId = user?.id;
                const username = user?.username;

                if (telegramId) {
                    fetch("https://telegram-server-hfk7.onrender.com/save", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ telegramId, username, stars: Game.stars })
                    }).catch(err => console.error("Ошибка сохранения звёзд:", err));
                }

                localStorage.setItem("stars", Game.stars);
            } catch (e) {
                console.error("Ошибка при сохранении звёзд:", e);
                localStorage.setItem("stars", Game.stars);
            }
            updateProgressBoxes();
        }
        function updateProgressBoxes() {
            const bar = document.getElementById("progress-bar");
            const currentBoxes = bar.children.length;
            const totalBoxes = Math.min(3 + Math.floor(Game.stars / 20), 20);

            if (currentBoxes === totalBoxes) return; // ничего не менять

            bar.innerHTML = "";

            for (let i = 0; i < totalBoxes; i++) {
                const box = document.createElement("div");
                box.className = "progress-box";
                bar.appendChild(box);
            }

            progressCount = Math.min(progressCount, totalBoxes);
        }
        function loadStars() {
            try {
                // ✅ Всегда сразу показываем stars из localStorage
                Game.stars = parseInt(localStorage.getItem("stars")) || 0;
                updateStarsUI();
                updateProgressBoxes();
                loadProgressBoxes();
                const user = Telegram.WebApp.initDataUnsafe?.user;
                const telegramId = user?.id;

                if (!telegramId) return;

                fetch(`https://telegram-server-hfk7.onrender.com/load/${telegramId}`)
                    .then(res => res.json())
                    .then(data => {
                        if (data && typeof data.stars !== "undefined") {
                            Game.stars = parseInt(data.stars);
                        } else {
                            Game.stars = parseInt(localStorage.getItem("stars")) || 0;
                        }
                        updateStarsUI();
                        updateProgressBoxes();
                        loadProgressBoxes();
                    })
                    .catch(() => {
                        updateStarsUI();
                        updateProgressBoxes();
                        loadProgressBoxes();
                    });
            } catch (e) {
                console.error("Ошибка при загрузке звёзд:", e);
                updateStarsUI();
                updateProgressBoxes();
                loadProgressBoxes();
            }
        }

        function updateStarsUI() {
            document.getElementById("stars").innerText = `⭐ ${Game.stars}`;
        }

        async function loadWordsAndSetOptions() {
            try {
                if (easywords.length === 0) {
                    const response = await fetch('videothemes/json/videotheme11.json?nocache=' + new Date().getTime());
                    easywords = await response.json();
                    const storedWords = JSON.parse(localStorage.getItem('easywords')) || {};
                    easywords.forEach(word => {
                        if (storedWords[word.video]) {
                            word.new = storedWords[word.video].new;
                        }
                    });
                }

                let correctWord;
                if (preloadedWord) {
                    correctWord = preloadedWord;
                    preloadedWord = null;
                } else {
                    const newWords = easywords.filter(w => w.new === true);
                    let pool = newWords.length > 0 ? newWords : easywords;
                    pool = pool.filter(w => !recentWords.includes(w.video));
                    if (pool.length === 0) pool = easywords;
                    correctWord = pool[Math.floor(Math.random() * pool.length)];
                }

                currentWordIndex = easywords.indexOf(correctWord);

                let wrongWord;
                do {
                    wrongWord = easywords[Math.floor(Math.random() * easywords.length)].russian;
                } while (wrongWord === correctWord.russian);

                const options = [correctWord.russian, wrongWord];
                const shuffledIndex = Math.random() < 0.5 ? 0 : 1;

                document.getElementById("option1").innerText = options[shuffledIndex];
                document.getElementById("option2").innerText = options[1 - shuffledIndex];

                const video = document.getElementById("wordVideo");
                if (/iPhone|iPad|iPod/.test(navigator.userAgent)) {
                    video.src = correctWord.videoMp4;
                } else {
                    video.src = correctWord.video;
                }
                video.load();
                video.play();

                document.getElementById("koreanText").innerText = correctWord.korean;
                document.getElementById("koreanText").style.display = "none";
                document.getElementById("showKoreanButton").style.display = "inline-block";

                updateSaveButtonState();

                correctAnswer = correctWord.russian;

                recentWords.push(correctWord.video);
                if (recentWords.length > recentLimit) recentWords.shift();

                preloadNextVideo();

            } catch (e) {
                console.error("Ошибка загрузки слов:", e);
            }
        }


        function checkWord(button) {
            const isCorrect = button.innerText === correctAnswer;
            button.style.backgroundColor = isCorrect ? "lightgreen" : "lightcoral";

            const boxes = document.querySelectorAll('.progress-box');
            const totalBoxes = boxes.length;

            if (isCorrect) {
                new Audio('excellent.mp3').play();
                const word = easywords[currentWordIndex];
                if (word.new) {
                    word.new = false;
                    const storedWords = JSON.parse(localStorage.getItem('easywords')) || {};
                    storedWords[word.video] = { new: false };
                    localStorage.setItem('easywords', JSON.stringify(storedWords));
                }

                if (progressCount < totalBoxes) {
                    boxes[progressCount].style.backgroundColor = 'lightgreen';
                    progressCount++;
                    saveProgressBoxes();
                }

                if (progressCount === totalBoxes) {
                    Game.stars++;
                    updateStarsUI();
                    const starsElement = document.getElementById("stars");
                    starsElement.classList.add("pulsing");

                    setTimeout(() => {
                        starsElement.classList.remove("pulsing");
                    }, 300); // длительность анимации = 0.3s
                    new Audio('starsuccess.mp3').play();
                    saveStars();
                    setTimeout(() => {
                        progressCount = 0;
                        boxes.forEach(box => box.style.backgroundColor = 'white');
                        localStorage.setItem(window.location.pathname + "_progressCount", 0);
                        button.style.backgroundColor = "";
                        loadWordsAndSetOptions();
                    }, 1000);
                    return;
                }
            } else {
                 if (progressCount > 0) {
            const index = Math.min(progressCount - 1, boxes.length - 1);
            boxes[index].style.backgroundColor = 'lightcoral';
            setTimeout(() => {
                boxes[index].style.backgroundColor = 'white';
                progressCount = index; // откатываем на скорректированное значение
                saveProgressBoxes();
            }, 300);
        }
    }

    setTimeout(() => {
        button.style.backgroundColor = "";
        loadWordsAndSetOptions();
    }, 500);
}

            

        function saveProgressBoxes() {
            localStorage.setItem(window.location.pathname + "_progressCount", progressCount);
        }

        function loadProgressBoxes() {
        const boxes = document.querySelectorAll('.progress-box');
    const saved = parseInt(localStorage.getItem(window.location.pathname + "_progressCount"));
    progressCount = Math.min(saved, boxes.length);
    
    const totalBoxes = boxes.length;

    if (!isNaN(saved)) {
        progressCount = Math.min(saved, boxes.length);
    } else {
        progressCount = 0;
    }

    for (let i = 0; i < boxes.length; i++) {
        boxes[i].style.backgroundColor = i < progressCount ? 'lightgreen' : 'white';
    }
}



        function showKoreanText() {
            document.getElementById("koreanText").style.display = "block";
            document.getElementById("showKoreanButton").style.display = "none";
        }
        document.addEventListener("DOMContentLoaded", () => {
            loadStars();
            loadWordsAndSetOptions();
            startTimerOnPage();
        });

        function startTimerOnPage() {
            const isMember = localStorage.getItem("member") === "true";
            const display = document.querySelector('.timer');
            if (isMember) {
                display.style.display = "block";
                display.style.background = "none";
                display.style.boxShadow = "none";
                display.innerHTML = '<img src="videothemes/icons/goldkimchi.png" alt="Gold Kimchi"  >';
                const label = document.createElement("div");
                label.innerHTML = "У вас есть<br><strong>Золотое Кимчи</strong>";
                label.className = "goldkimchi-label";
                display.appendChild(label);

                const img = display.querySelector("img");
                if (img) {
                    img.style.cursor = "pointer";
                    img.addEventListener("click", () => {
                        label.style.display = "block";
                        setTimeout(() => {
                            label.style.display = "none";
                        }, 2000);
                    });
                }
                return;
            }

            let remainingTime = parseInt(localStorage.getItem("remainingTime"), 10);
            if (isNaN(remainingTime)) {
                remainingTime = 5 * 60;
                localStorage.setItem("remainingTime", remainingTime);
            }

            display.style.display = "block";
            let timerInterval;
            let showTime = false;

            function updateDisplay() {
                if (showTime) {
                    const minutes = Math.floor(remainingTime / 60);
                    const seconds = remainingTime % 60;
                    display.style.color = remainingTime <= 60 ? 'red' : 'black';
                    display.textContent = `${minutes < 10 ? "0" : ""}${minutes}:${seconds < 10 ? "0" : ""}${seconds}`;
                } else {
                    display.textContent = "⏳";
                }
            }

            function startCountdown() {
                timerInterval = setInterval(() => {
                    remainingTime--;
                    if (remainingTime <= 0) {
                        clearInterval(timerInterval);
                        remainingTime = 0;
                        localStorage.setItem("remainingTime", remainingTime);
                        window.location.href = "index.html";
                    }
                    if (showTime) updateDisplay();
                    localStorage.setItem("remainingTime", remainingTime);
                }, 1000);
            }

            function stopCountdown() {
                clearInterval(timerInterval);
            }

            display.addEventListener("click", () => {
                showTime = !showTime;
                updateDisplay();
            });

            document.addEventListener("visibilitychange", () => {
                if (document.hidden) {
                    stopCountdown();
                } else {
                    startCountdown();
                }
            });

            updateDisplay();
            if (!document.hidden) {
                startCountdown();
            }

            window.addEventListener("beforeunload", () => {
                stopCountdown();
                localStorage.setItem("remainingTime", remainingTime);
            });
        }



        function saveToBank() {
            const word = easywords[currentWordIndex];
            if (!word) return;

            let savedWords = JSON.parse(localStorage.getItem("savedWords")) || [];
            const index = savedWords.findIndex(item => item.video === word.video);
            const button = document.getElementById("save-to-bank-button");
            const icon = document.getElementById("bank-icon");

            if (index !== -1) {
                // Удаляем из избранного
                savedWords.splice(index, 1);
                button.classList.remove("active");
                icon.src = "videothemes/icons/outbank.png";
            } else {
                // Добавляем в избранное
                savedWords.push({
                    video: word.video,
                    korean: word.korean,
                    russian: word.russian
                });
                button.classList.add("active");
                icon.src = "videothemes/icons/inbank.png";
            }

            localStorage.setItem("savedWords", JSON.stringify(savedWords));
        }

        function updateSaveButtonState() {
            const word = easywords[currentWordIndex];
            if (!word) return;

            const savedWords = JSON.parse(localStorage.getItem("savedWords")) || [];
            const exists = savedWords.some(item => item.video === word.video);

            const button = document.getElementById("save-to-bank-button");
            const icon = document.getElementById("bank-icon");

            if (exists) {
                button.classList.add("active");
                icon.src = "videothemes/icons/inbank.png";
            } else {
                button.classList.remove("active");
                icon.src = "videothemes/icons/outbank.png";
            }
        }


        function preloadNextVideo() {
            let nextWord;
            const newWords = easywords.filter(word => word.new === true);
            let pool = newWords.length > 0 ? newWords : easywords;

            pool = pool.filter(w => !recentWords.includes(w.video));
            if (pool.length === 0) pool = easywords;

            nextWord = pool[Math.floor(Math.random() * pool.length)];
            preloadedWord = nextWord;
            preloadedVideoSrc = nextWord.video;

            const preload = document.createElement("video");
            preload.src = preloadedVideoSrc;
            preload.preload = "auto";
            preload.style.display = "none";
            document.body.appendChild(preload);
        }
        function goHome() {
            var pushAudio = new Audio('pushButton.mp3');
            pushAudio.play();
            setTimeout(() => {
                window.location.href = "videothemes.html";
            }, 150); // небольшая задержка, чтобы звук успел сыграть
        }

        const video = document.getElementById("wordVideo");
        let repeatActive = false;

        document.getElementById("play-btn").onclick = () => {
            video.loop = false;
            if (video.paused) {
                video.play();
            } else {
                video.pause();
            }
        };

        document.getElementById("repeat-btn").onclick = () => {
            if (!repeatActive) {
                video.loop = true;
                video.play();
                repeatActive = true;
            } else {
                video.loop = false;
                video.pause();
                repeatActive = false;
            }
        };

        document.getElementById("speed-select").onchange = (e) => {
            video.playbackRate = parseFloat(e.target.value);
        };
    </script>
</body>

</html>
