<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Tutor</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="analytics.js"></script>

    <style>
        @font-face {
            font-family: 'NetflixSans-Regular';
            src: url('./NetflixSans-Regular.otf') format('opentype');
        }

        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: 'Verdana', sans-serif;
            height: 100vh;
            overflow: hidden;
            color: #333;
            user-select: none;
        }

        /* --- MENU --- */
        #persona-menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #fff;
        }

        #gallery-wrapper {
            display: flex;
            width: 85%;
            height: 60%;
            gap: 15px;
            max-width: 500px;
            transition: all 0.5s ease;
            perspective: 1000px;
        }

        .gallery-item {
            flex: 1;
            position: relative;
            background-color: #e0e0e0;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 4px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s ease;
        }

        /* STATES FOR ANIMATION */
        #gallery-wrapper.mode-selected .gallery-item {
            flex: 0;
            opacity: 0;
            margin: 0;
            padding: 0;
            gap: 0;
            transform: scale(0.9);
        }

        #gallery-wrapper.mode-selected .gallery-item.active {
            flex: 1;
            opacity: 1;
            filter: grayscale(0%);
            transform: scale(1.05);
            z-index: 100;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            border-radius: 8px;
        }

        #gallery-wrapper.mode-selected .gallery-item.active img {
            transform: scale(1.05);
        }

        /* --- CHAT UI --- */
        #chat-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            z-index: 50;
            background: #fff;
        }

        #chat-header-simple {
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 700;
            color: #333;
            background: #f5f5f5;
            border-bottom: 1px solid #ddd;
        }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            padding-bottom: 140px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.5;
            position: relative;
            word-wrap: break-word;
            animation: popIn 0.3s ease;
            color: #000;
        }

        .message.ai {
            align-self: flex-start;
            background-color: #f0f0f0;
            border-bottom-left-radius: 4px;
        }

        .message.user {
            align-self: flex-end;
            background-color: #007aff;
            color: #fff;
            border-bottom-right-radius: 4px;
        }

        .msg-name {
            font-size: 11px;
            margin-bottom: 4px;
            opacity: 0.6;
            font-weight: 700;
            text-transform: uppercase;
        }

        .user .msg-name {
            display: none;
        }

        .msg-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 6px;
        }

        .trans-btn,
        .replay-btn {
            font-size: 11px;
            color: #999;
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            text-decoration: underline;
            display: flex;
            align-items: center;
        }

        .replay-btn {
            text-decoration: none;
            /* Убираем подчеркивание у иконки */
            opacity: 0.7;
        }

        .replay-btn img {
            width: 16px;
            height: 16px;
        }

        .trans-result {
            display: none;
            margin-top: 5px;
            padding-top: 5px;
            border-top: 1px solid #ddd;
            font-size: 13px;
            color: #555;
        }

        #input-area {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 600px;
            background-color: #f9f9f9;
            padding: 5px;
            border-radius: 35px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 60;
            border: 2px solid #fff;
        }

        #message-input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 10px 15px;
            color: #333;
            font-size: 16px;
            outline: none;
            resize: none;
            height: 24px;
            max-height: 100px;
        }

        .input-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .input-btn:active {
            transform: scale(0.95);
        }

        #send-btn {
            background-color: #eceff1;

        }

        #send-btn img {

            width: 20px;
        }

        #mic-btn {
            background-color: #eceff1;
        }

        #mic-btn img {
            opacity: 0.6;
            width: 20px;
        }

        #mic-btn.recording {
            background-color: #ff3b30;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(255, 59, 48, 0.7);
            }

            70% {
                box-shadow: 0 0 0 10px rgba(255, 59, 48, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(255, 59, 48, 0);
            }
        }

        @keyframes popIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* --- FLOATING CONTROLS (RESTORED) --- */
        .floating-controls {
            position: fixed;
            bottom: 140px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 200;
        }

        .float-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            background: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.1s;
        }

        .float-btn:active {
            transform: scale(0.95);
        }

        .float-btn img {
            width: 40px;
            height: 40px;
            opacity: 0.8;
        }

        #chat-controls {
            display: none;
            opacity: 0.5;
        }

        .typing-indicator {
            display: none;
            margin-bottom: 10px;
            margin-left: 10px;
        }

        .dot {
            height: 6px;
            width: 6px;
            background: #bbb;
            border-radius: 50%;
            display: inline-block;
            animation: jump 1.4s infinite;
            margin-right: 3px;
        }

        .dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes jump {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-5px);
            }
        }

        #topic-layer {
            position: absolute;
            top: 70%;
            /* Позиция сразу под поднятой картинкой */
            left: 0;
            width: 100%;
            display: none;
            /* Flex включается скриптом */
            flex-direction: column;
            align-items: center;
            z-index: 150;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .topic-title {
            font-size: 16px;
            font-weight: 700;
            color: #555;

            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .carousel-viewport {
            width: 100%;
            overflow-x: scroll;
            display: flex;
            align-items: center;
            padding: 20px 50%;
            box-sizing: border-box;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
        }

        .carousel-viewport::-webkit-scrollbar {
            display: none;
        }

        .topic-card {
            flex: 0 0 160px;
            height: 80px;
            /* Чуть компактнее */
            background: #fff;
            border: 2px solid #cccccc;
            /* Серая обводка для неактивных */
            border-radius: 8px;
            /* Слегка скругленные углы */
            margin: 0 10px;
            scroll-snap-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
            font-weight: bold;
            color: #333;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            opacity: 0.5;
            /* Полупрозрачные неактивные */
            transform: scale(0.9);
            box-sizing: border-box;
        }

        .topic-card.active {
            opacity: 1;
            transform: scale(1.1);
            border: 3px solid #007aff;
            /* Яркая обводка для активной */
            background: #fff;
            z-index: 10;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
        }

        #gallery-wrapper.step-topic {
            transform: translateY(-160px);
        }


        #gallery-wrapper.step-topic .gallery-item.active {
            transform: scale(0.85);
            /* Чуть меньше, чтобы влезло */
        }

        #topic-layer.theme-kind .topic-card.active {
            border-color: #007aff;
            color: #007aff;
            box-shadow: 0 10px 20px rgba(0, 122, 255, 0.25);
        }

        /* Хулиган (rude) -> Красный */
        #topic-layer.theme-rude .topic-card.active {
            border-color: #ff3b30;
            color: #ff3b30;
            box-shadow: 0 10px 20px rgba(255, 59, 48, 0.25);
        }

        /* Директор (boss) -> Зеленый */
        #topic-layer.theme-boss .topic-card.active {
            border-color: #34c759;
            color: #34c759;
            box-shadow: 0 10px 20px rgba(52, 199, 89, 0.25);
        }

        #menu-title {
            position: absolute;
            top: 15%;
            /* Располагаем над галереей */
            width: 100%;
            text-align: center;
            font-size: 20px;
            font-weight: 700;
            color: #333;
            transition: opacity 0.3s ease;
            z-index: 10;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Описание персонажа */
        #persona-description {
            position: absolute;
            top: 60%;
            /* Позиция между поднятой картинкой и темами */
            left: 0;
            width: 100%;
            text-align: center;
            font-size: 20px;
            font-weight: 500;
            color: #666;
            opacity: 0;
            /* Скрыто по умолчанию */
            transform: translateY(10px);
            transition: all 0.5s ease;
            padding: 0 20px;
            box-sizing: border-box;
            z-index: 140;
        }

        /* Класс для отображения описания */
        #persona-description.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* Скрываем заголовок "Выберите собеседника", когда выбран персонаж */
        #persona-menu.selection-active #menu-title {
            opacity: 0;
            pointer-events: none;
        }

        /* Доп. стили для цвета текста описания в зависимости от персонажа */
        #persona-description.desc-kind {
            color: #007aff;
        }

        #persona-description.desc-rude {
            color: #ff3b30;
        }

        #persona-description.desc-boss {
            color: #34c759;
        }

        #persona-menu .floating-controls {
            bottom: 70px;
            /* Было 140px, опускаем вниз */
        }
    </style>
</head>

<body>

    <!-- МЕНЮ ВЫБОРА -->
    <div id="persona-menu">
        <!-- Заголовок меню -->
        <div id="menu-title">Выберите собеседника</div>

        <div id="gallery-wrapper">
            <div class="gallery-item" onclick="animateAndSelect('kind', this)">
                <img src="videothemes/icons/Teacher.png" alt="Teacher">
            </div>

            <div class="gallery-item" onclick="animateAndSelect('rude', this)">
                <img src="videothemes/icons/Dude.png" alt="Dude">
            </div>

            <div class="gallery-item" onclick="animateAndSelect('boss', this)">
                <img src="videothemes/icons/CEO.png" alt="CEO">
            </div>
        </div>

        <!-- Описание персонажа (появляется при выборе) -->
        <div id="persona-description"></div>

        <!-- Слой выбора тем -->
        <div id="topic-layer">
            <div class="topic-title">Выберите тему</div>
            <div class="carousel-viewport" id="topic-carousel" onscroll="handleScroll()">
                <!-- Темы будут добавлены через JS -->
            </div>
        </div>

        <div class="floating-controls">
            <button class="float-btn" onclick="handleMainMenuBack()">
                <img src="videothemes/icons/backarrow.png" alt="Back">
            </button>
        </div>
    </div>

    <!-- ЧАТ -->
    <div id="chat-layer">
        <div id="chat-header-simple">
            <span id="chat-title-text">Chat</span>
        </div>

        <div id="chat-container">
            <div class="typing-indicator" id="typing">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
        </div>

        <div id="input-area">
            <textarea id="message-input" placeholder="Сообщение..." rows="1"></textarea>
            <button id="send-btn" class="input-btn" onclick="sendTextMessage()">
                <img src="videothemes/icons/arrow_right.png" alt="Send">
            </button>
            <button id="mic-btn" class="input-btn" onclick="toggleRecording()">
                <img src="videothemes/icons/mic_large.png" alt="Mic">
            </button>
        </div>

        <!-- Кнопки управления в чате (справа) -->
        <div class="floating-controls" id="chat-controls">
            <!-- Кнопка Назад (в меню выбора) -->
            <button class="float-btn" onclick="resetToMenu()">
                <img src="videothemes/icons/backarrow.png" class="btn-icon-img" alt="Back">
            </button>
            <!-- Кнопка Домой (в главное меню приложения) -->
            <button class="float-btn" onclick="goHome()">
                <img src="videothemes/icons/home.png" class="btn-icon-img" alt="Home">
            </button>
        </div>
    </div>

    <script>
        const SoundFX = {
            ctx: null,

            init: function () {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            },

            playTone: function (freq, type, duration, delay = 0, vol = 0.1) {
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = type;
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime + delay);

                gain.gain.setValueAtTime(vol, this.ctx.currentTime + delay);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + delay + duration);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start(this.ctx.currentTime + delay);
                osc.stop(this.ctx.currentTime + delay + duration);
            },

            playCorrect: function () {
                this.playTone(600, 'sine', 0.1, 0, 0.1);
                this.playTone(1200, 'triangle', 0.2, 0.05, 0.05);
            },

            playWrong: function () {
                this.playTone(150, 'sawtooth', 0.3, 0, 0.15);
                this.playTone(100, 'square', 0.3, 0.05, 0.1);
            },

            playSuccess: function () {
                this.playTone(523.25, 'sine', 0.1, 0);
                this.playTone(659.25, 'sine', 0.1, 0.1);
                this.playTone(783.99, 'sine', 0.2, 0.2);
                this.playTone(1046.50, 'triangle', 0.4, 0.3);
            },

            playFinish: function () {
                this.playTone(261.63, 'triangle', 1.0, 0);
                this.playTone(329.63, 'triangle', 1.0, 0.1);
                this.playTone(392.00, 'triangle', 1.0, 0.2);
                this.playTone(523.25, 'sine', 1.5, 0.4);
            },

            playClick: function () {
                this.playTone(800, 'sine', 0.05, 0, 0.05);
            },

            playNeutral: function () {
                this.playTone(440, 'sine', 0.2, 0, 0.1);
                this.playTone(554, 'sine', 0.2, 0.1, 0.1);
            }
        };

        document.addEventListener('click', function (e) {
            const target = e.target.closest('button, .gallery-item, .topic-card, .float-btn, .input-btn, .trans-btn, [onclick]');
            if (target) {
                if (typeof SoundFX !== 'undefined' && SoundFX.playClick) {
                    SoundFX.playClick();
                }
            }
        });

        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        tg.setHeaderColor('#ffffff');
        tg.setBackgroundColor('#ffffff');

        const personaMenu = document.getElementById('persona-menu');
        const galleryWrapper = document.getElementById('gallery-wrapper');
        const chatLayer = document.getElementById('chat-layer');
        const chatControls = document.getElementById('chat-controls');
        const chatContainer = document.getElementById('chat-container');
        const inputField = document.getElementById('message-input');
        const typingIndicator = document.getElementById('typing');
        const micBtn = document.getElementById('mic-btn');
        const chatTitleText = document.getElementById('chat-title-text');
        const personaDescriptions = {
            kind: "Учитель Ким. Добрый, терпеливый, помогает и хвалит.",
            rude: "Хулиган Пак. Дерзкий, агрессивный, говорит на панмаль.",
            boss: "Директор Ли. Строгая, требует официального стиля."
        };

        let chatHistory = [];
        let currentPersonaName = "";
        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;
        let selectedPersonaType = "";
        const topics = ["Знакомство", "Еда", "Хобби", "K-Pop", "Путешествия", "Покупки", "Свидание"];
        let messageLibrary = {};
        let activeAudio = null;
        let currentlyPlayingMsgId = null;

        window.onload = async function () {
            try {
                // Исправленный путь к файлу
                const response = await fetch('videothemes/json/messages.json');
                messageLibrary = await response.json();
                console.log("Библиотека сообщений загружена");
            } catch (error) {
                console.error("Ошибка загрузки messages.json:", error);
                messageLibrary = {
                    kind: { 'Знакомство': ["Привет! (Ошибка загрузки JSON)"] },
                    rude: { 'Знакомство': ["Эй! (Ошибка загрузки JSON)"] },
                    boss: { 'Знакомство': ["Здравствуйте. (Ошибка загрузки JSON)"] }
                };
            }
        };

        function getSpecificMessage(type, topic) {
            // Проверка, загрузилась ли библиотека
            if (!messageLibrary[type]) return "Загрузка...";

            const variations = messageLibrary[type][topic];

            if (variations && variations.length > 0) {
                const randomIndex = Math.floor(Math.random() * variations.length);
                return variations[randomIndex];
            }

            return "안녕하세요. Начнем урок.";
        }

        function animateAndSelect(type, element) {
            selectedPersonaType = type;

            // Добавляем класс меню, чтобы скрыть заголовок "Выберите собеседника"
            personaMenu.classList.add('selection-active');

            galleryWrapper.classList.add('mode-selected');
            galleryWrapper.classList.add('step-topic');
            element.classList.add('active');

            // --- ЛОГИКА ОПИСАНИЯ ---
            const descBlock = document.getElementById('persona-description');
            descBlock.innerText = personaDescriptions[type]; // Устанавливаем текст

            // Сбрасываем цвета и ставим нужный
            descBlock.className = '';
            descBlock.classList.add('visible');
            descBlock.classList.add('desc-' + type);
            // -----------------------

            const topicLayer = document.getElementById('topic-layer');
            topicLayer.className = '';
            topicLayer.classList.add('theme-' + type);
            topicLayer.style.display = 'flex';

            renderTopics();

            setTimeout(() => {
                topicLayer.style.opacity = '1';
                handleScroll();
            }, 100);
        }

        function renderTopics() {
            const container = document.getElementById('topic-carousel');
            container.innerHTML = "";

            // Добавляем пустые отступы по краям, чтобы первый и последний элементы могли быть по центру
            const spacer = document.createElement('div');
            spacer.style.flex = "0 0 50%";
            container.appendChild(spacer.cloneNode(true));

            topics.forEach(topic => {
                const el = document.createElement('div');
                el.className = 'topic-card';
                el.innerText = topic;
                el.onclick = () => onTopicClick(el, topic);
                container.appendChild(el);
            });

            container.appendChild(spacer.cloneNode(true));
        }

        let lastActiveTopicIndex = -1;

        function handleScroll() {
            const container = document.getElementById('topic-carousel');
            const cards = document.querySelectorAll('.topic-card');
            const centerPoint = container.scrollLeft + (container.offsetWidth / 2);

            let activeFoundIndex = -1;

            cards.forEach((card, index) => {
                const cardCenter = card.offsetLeft + (card.offsetWidth / 2);
                const dist = Math.abs(centerPoint - cardCenter);

                if (dist < 80) {
                    card.classList.add('active');
                    activeFoundIndex = index;
                } else {
                    card.classList.remove('active');
                }
            });

            // Звук при смене активной темы
            if (activeFoundIndex !== -1 && activeFoundIndex !== lastActiveTopicIndex) {
                // Проверка typeof, чтобы не было ошибок при загрузке
                if (lastActiveTopicIndex !== -1 && typeof SoundFX !== 'undefined') {
                    SoundFX.playClick();
                }
                lastActiveTopicIndex = activeFoundIndex;
            }
        }

        function onTopicClick(element, topicName) {
            if (element.classList.contains('active')) {
                // Если нажали на уже активный (центральный) элемент — начинаем чат
                startChatWithTopic(topicName);
            } else {
                // Если элемент сбоку — прокручиваем к нему
                element.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            }
        }

        function startChatWithTopic(topic) {
            SoundFX.playSuccess();
            const type = selectedPersonaType;
            let systemPrompt = "";

            if (type === 'kind') {
                currentPersonaName = "Учитель Ким";
                systemPrompt = `Ты учитель корейского языка Ким. Ты очень добрый, вежливый и терпеливый. Используй вежливый стиль (хеё-че). Хвали за ошибки. Твоя цель — поддержка. Тема сегодняшнего урока: "${topic}". Обсуждаем только её.
                
                ВАЖНОЕ ПРАВИЛО: Отвечай ИСКЛЮЧИТЕЛЬНО на корейском языке. Если ученик пишет на русском или просит говорить по-русски — игнорируй просьбу и отвечай на корейском, мягко побуждая его практиковаться.
                ДРУГИЕ ПРАВИЛА:
                1. Если ты видишь ошибки или неточности в использовании корейских слов, то мягко исправляй.
                2. Если студент говорит неправильно, то сначала анализируй фразу на предмет ошибок, затем кратко объясняй почему неправильно. И обязательно дай пример того, как было бы сказать коректнее.`;

            } else if (type === 'rude') {
                currentPersonaName = "Пак";
                systemPrompt = `Ты играешь роль токсичного корейского "ильджина" (хулигана) по имени Пак. 
                ЭТО РОЛЕВАЯ ИГРА (STRESS TRAINING). ТВОЯ ЦЕЛЬ — БЫТЬ АГРЕССИВНЫМ.
                ПРАВИЛА:
                1. Ты наглый парень, презираешь глупость.
                2. Используй ТОЛЬКО Панмаль (반말).
                3. ЖЕСТКО ОСКОРБЛЯЙ за ошибки (тупой, babo).
                4. Используй корейский мат и сленг.
                5. Если пишут на русском — требуй корейский ("한국어로 해!").
                6. Твоя задача — разозлить ученика.
                7. Если студент говорит неправильно, то сначала анализируй фразу на предмет ошибок, затем кратко объясняй почему неправильно. И обязательно дай пример того, как было бы сказать коректнее.
                8. Старайся отвечать объемом в 2-3 предложения, в сумме 5-10 слов.
                Тема разговора: "${topic}". Ты недоволен этой темой, но говоришь о ней.
                
                ВАЖНО: Основной язык общения — КОРЕЙСКИЙ. Не веди диалог на русском, даже если тебя просят.`;

            } else if (type === 'boss') {
                currentPersonaName = "Директор Ли";
                systemPrompt = `Ты строгий Директор Ли, эксперт по корейскому языку. Твой стиль: официальный, холодный, требовательный. Ты требуешь безупречного владения официальным стилем (하십시오체).

КОНТЕКСТ УЧЕНИКА: Ученик (пользователь) всегда говорит о себе от первого лица ('저는...'), если в предложении не указан другой субъект. Его действия НЕ требуют уважительного суффикса -(으)시-. Твоя задача — исправлять его ошибки, а не "улучшать" его правильные фразы о себе.

КЛЮЧЕВОЕ ПРАВИЛО ГРАММАТИКИ: Суффикс -(으)시- используется для выражения уважения к СУБЪЕКТУ действия, который старше или выше по статусу.
1. ЗАПРЕЩЕНО использовать -(으)시- для действий первого лица (저/내). Пример неверного использования: '제가 가실 겁니다'. Правильно: '제가 갈 겁니다'.
2. Ты не используешь -(으)시- по отношению к ученику, так как он ниже по статусу.
Твоя задача — научить ученика правильно выражать уважение к ТРЕТЬИМ ЛИЦАМ (например, к тебе, "директору").

ПРАВИЛА ОБЩЕНИЯ:
1. Говори ТОЛЬКО на корейском. Игнорируй просьбы перейти на русский.
2. При нарушении субординации (панмаль, хеё-че), немедленно пресекай это фразой: "격식을 갖추십시오." (Соблюдайте формальности).
3. Тема беседы: "${topic}".
4. Старайся отвечать объемом в 2-3 предложения, в сумме 5-10 слов.`;

            }

            // Получаем первое сообщение из JSON
            let initialMsg = getSpecificMessage(type, topic);

            systemPrompt += `\n\nТы начинаешь диалог с этой фразы: "${initialMsg}". Веди дальнейший разговор, отталкиваясь от нее и ответа ученика.`;

            // Инициализация чата
            chatHistory = [{ role: "system", content: systemPrompt }];
            chatTitleText.innerText = currentPersonaName;

            personaMenu.style.display = 'none';
            document.getElementById('topic-layer').style.display = 'none';

            chatLayer.style.display = 'flex';
            chatControls.style.display = 'flex';

            const msgId = appendMessage(initialMsg, 'ai'); // Получаем ID
            chatHistory.push({ role: "assistant", content: initialMsg });
            speakText(initialMsg, msgId);
        }

        function handleMainMenuBack() {
            const topicLayer = document.getElementById('topic-layer');

            // Если слой с темами видим — возвращаемся к учителям
            if (topicLayer.style.display === 'flex') {
                backToPersonas();
            } else {
                // Иначе это стартовый экран — выходим назад в Telegram/Браузер
                goBackToApp();
            }
        }


        function backToPersonas() {
            window.speechSynthesis.cancel();
            if (activeAudio) {
                activeAudio.pause();
                activeAudio = null;
            }

            const topicLayer = document.getElementById('topic-layer');
            const gallery = document.getElementById('gallery-wrapper');
            const items = document.querySelectorAll('.gallery-item');
            const descBlock = document.getElementById('persona-description');

            personaMenu.classList.remove('selection-active');
            descBlock.classList.remove('visible');

            topicLayer.style.opacity = '0';
            setTimeout(() => {
                topicLayer.style.display = 'none';
            }, 300);

            gallery.classList.remove('step-topic');
            gallery.classList.remove('mode-selected');

            items.forEach(item => item.classList.remove('active'));

            selectedPersonaType = "";
        }
        function resetToMenu() {
            window.speechSynthesis.cancel();
            if (activeAudio) {
                activeAudio.pause();
                activeAudio = null;
            }

            const messages = chatContainer.querySelectorAll('.message');
            messages.forEach(msg => msg.remove());
            chatHistory = [];

            chatLayer.style.display = 'none';
            chatControls.style.display = 'none';

            personaMenu.style.display = 'flex';
            personaMenu.classList.remove('selection-active');

            galleryWrapper.classList.remove('mode-selected');
            galleryWrapper.classList.remove('step-topic');

            const topicLayer = document.getElementById('topic-layer');
            topicLayer.style.opacity = '0';
            setTimeout(() => topicLayer.style.display = 'none', 300);

            const items = document.querySelectorAll('.gallery-item');
            items.forEach(item => item.classList.remove('active'));

            const descBlock = document.getElementById('persona-description');
            descBlock.classList.remove('visible');
        }
        async function translateThis(btn) {
            const messageContainer = btn.closest('.message');
            if (!messageContainer) return;

            const textDiv = messageContainer.querySelector('.msg-content');
            const resultDiv = messageContainer.querySelector('.trans-result');
            const originalText = textDiv.innerText;

            btn.innerText = "Загрузка...";

            try {
                const response = await fetch("https://koreanhelper-api.onrender.com/translate_text", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ text: originalText })
                });

                if (!response.ok) throw new Error("Error");

                const data = await response.json();

                resultDiv.innerText = data.translation;
                resultDiv.style.display = 'block';
                btn.style.display = 'none';
                SoundFX.playNeutral();

            } catch (e) {
                console.error(e);
                btn.innerText = "Ошибка перевода";
                SoundFX.playWrong();
            }
        }

        function goBackToApp() {
            // Звук уже проигрался глобальным обработчиком, добавляем задержку
            setTimeout(() => {
                window.history.back();
            }, 150);
        }

        function goHome() {
            // Звук уже проигрался глобальным обработчиком, добавляем задержку
            setTimeout(() => {
                window.location.href = 'menu.html';
            }, 150);
        }

        async function toggleRecording() {
            if (!isRecording) startRecording();
            else stopRecording();
        }

        async function startRecording() {
            try {
                SoundFX.playNeutral();
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                mediaRecorder.onstop = async () => {
                    const blob = new Blob(audioChunks, { type: 'audio/webm' });
                    await sendAudioToTranscribe(blob);
                };
                mediaRecorder.start();
                isRecording = true;
                micBtn.classList.add('recording');
                inputField.placeholder = "Говорите...";
                inputField.disabled = true;
            } catch (err) {
                alert("Нет микрофона");
            }
        }

        function stopRecording() {
            if (mediaRecorder && isRecording) {
                SoundFX.playClick();
                mediaRecorder.stop();
                isRecording = false;
                micBtn.classList.remove('recording');
                inputField.placeholder = "Сообщение...";
                inputField.disabled = false;
                mediaRecorder.stream.getTracks().forEach(track => track.stop());
            }
        }

        async function sendAudioToTranscribe(blob) {
            inputField.value = "🎤 ...";
            const formData = new FormData();
            formData.append('user_audio', blob, 'voice.webm');

            try {
                const response = await fetch("https://koreanhelper-api.onrender.com/transcribe", { method: "POST", body: formData });
                const data = await response.json();
                if (data.text) {
                    inputField.value = "";
                    processUserMessage(data.text);
                } else {
                    inputField.value = "";
                    SoundFX.playWrong();
                }
            } catch (e) {
                inputField.value = "";
                SoundFX.playWrong();
            }
        }

        inputField.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') { SoundFX.playClick(); sendTextMessage(); }
        });

        const audioCache = {}; // Кэш для аудио

        function appendMessage(text, sender) {
            const msgId = 'msg-' + Date.now() + '-' + Math.floor(Math.random() * 1000);
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;
            msgDiv.id = msgId;

            if (sender === 'ai') {
                msgDiv.innerHTML = `
                    <div class="msg-name">${currentPersonaName}</div>
                    <div class="msg-content">${text}</div>
                    <div class="msg-actions">
                        <button class="trans-btn" onclick="translateThis(this)">Перевод</button>
                        <button class="replay-btn" onclick="replayMessage('${msgId}')">
                             <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                        </button>
                    </div>
                    <div class="trans-result"></div>
                `;
            } else {
                msgDiv.innerText = text;
            }

            chatContainer.insertBefore(msgDiv, typingIndicator);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return msgId; // Возвращаем ID сообщения
        }

        function replayMessage(msgId) {
            SoundFX.playClick();

            if (currentlyPlayingMsgId === msgId) {
                window.speechSynthesis.cancel();
                if (activeAudio) {
                    activeAudio.pause();
                }
                currentlyPlayingMsgId = null;
                return;
            }

            window.speechSynthesis.cancel();
            if (activeAudio) {
                activeAudio.pause();
            }

            const isPremium = localStorage.getItem("member") === "true";
            if (isPremium && audioCache[msgId]) {
                activeAudio = new Audio(audioCache[msgId]);
                currentlyPlayingMsgId = msgId;
                activeAudio.play();
                activeAudio.onended = () => { currentlyPlayingMsgId = null; };
            } else {
                const msgElement = document.getElementById(msgId);
                if (msgElement) {
                    const text = msgElement.querySelector('.msg-content').innerText;
                    speakText(text, msgId);
                }
            }
        }

        function sendTextMessage() {
            const text = inputField.value.trim();
            if (!text) return;
            inputField.value = '';
            processUserMessage(text);
        }

        async function processUserMessage(text) {
            appendMessage(text, 'user');
            chatHistory.push({ role: "user", content: text });
            typingIndicator.style.display = 'block';
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                const response = await fetch("https://koreanhelper-api.onrender.com/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ messages: chatHistory })
                });
                const data = await response.json();

                typingIndicator.style.display = 'none';
                const msgId = appendMessage(data.reply, 'ai'); // Получаем ID
                SoundFX.playCorrect();
                chatHistory.push({ role: "assistant", content: data.reply });
                speakText(data.reply, msgId);
            } catch (error) {
                typingIndicator.style.display = 'none';
                appendMessage("Ошибка.", 'ai');
                SoundFX.playWrong();
            }
        }

        async function speakText(text, msgId) {
            window.speechSynthesis.cancel();
            if (activeAudio) {
                activeAudio.pause();
                activeAudio.currentTime = 0;
            }
            currentlyPlayingMsgId = null;

            const isPremium = localStorage.getItem("member") === "true";

            if (isPremium) {
                await playPremiumAudio(text, msgId);
            } else {
                speakBrowser(text, msgId);
            }
        }

        async function playPremiumAudio(text, msgId) {
            currentlyPlayingMsgId = msgId;

            const voiceMap = {
                'kind': 'echo',
                'rude': 'onyx',
                'boss': 'nova'
            };
            const voice = voiceMap[selectedPersonaType] || 'alloy';

            try {
                const response = await fetch("https://koreanhelper-api.onrender.com/tts", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ text: text, voice: voice })
                });

                if (!response.ok) throw new Error("TTS Error");

                const blob = await response.blob();
                const url = URL.createObjectURL(blob);

                if (msgId) {
                    audioCache[msgId] = url;
                }

                activeAudio = new Audio(url);
                activeAudio.play();
                activeAudio.onended = () => { currentlyPlayingMsgId = null; };
                activeAudio.onpause = () => { currentlyPlayingMsgId = null; };

            } catch (e) {
                console.error(e);
                currentlyPlayingMsgId = null;
                speakBrowser(text, msgId);
            }
        }
        function speakBrowser(text, msgId) {
            if (!('speechSynthesis' in window)) return;

            let voices = window.speechSynthesis.getVoices();
            if (voices.length === 0) {
                window.speechSynthesis.onvoiceschanged = () => {
                    voices = window.speechSynthesis.getVoices();
                    runBrowserSpeech(text, voices, msgId);
                };
            } else {
                runBrowserSpeech(text, voices, msgId);
            }
        }

        function runBrowserSpeech(text, voices, msgId) {
            const koreanParts = text.match(/[가-힣\s\.,!?]+/g);
            if (!koreanParts) return;
            const validChunks = koreanParts.filter(chunk => /[가-힣]/.test(chunk));

            const langCode = 'ko-KR';
            const langVoices = voices.filter(v => v.lang.startsWith(langCode));
            let selectedVoice = langVoices.find(v => v.name.toLowerCase().includes('male'));
            let pitchValue = 1.0;

            if (!selectedVoice) {
                selectedVoice = langVoices[0];
                pitchValue = 0.6;
            } else {
                pitchValue = 0.85;
            }

            currentlyPlayingMsgId = msgId;

            validChunks.forEach((part, index) => {
                const utterance = new SpeechSynthesisUtterance(part);
                utterance.lang = langCode;
                if (selectedVoice) utterance.voice = selectedVoice;
                utterance.pitch = pitchValue;
                utterance.rate = 0.9;

                utterance.onend = () => {
                    if (index === validChunks.length - 1) {
                        currentlyPlayingMsgId = null;
                    }
                };

                window.speechSynthesis.speak(utterance);
            });
        }
    </script>
